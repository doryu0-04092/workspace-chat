# gitleaks の設定（.github/workflows/audit.yml の「秘密の値がソースに書かれていないかの検査」）。
# 既定の規則をそのまま使う。誤検知で allowlist に行を足すときの扱いは、同じステップのコメント（代償の段）に記す。
[extend]
useDefault = true

[allowlist]
description = """
誤検知の除外。すべて、テストが「応答・ログに出ないこと」を確かめるために送る偽のパスワードである。
- leaky-secret-9f3k: apps/api/src/auth/register.test.ts の「本体を読み取れないとき」。
  generic-api-key（変数名 password と、数字を含みエントロピーが 3.5 を超える値）に当たった（PR #246 第4巡）。
  PR の走査はコミットごとに行うため、値を変えても当たったコミットが残る限り落ち続ける。
  除外は値の完全一致に限る（コミットごと除外すると、同じコミットに入った本物の秘密も見逃す）。
- argon2id-placeholder: API のテストが、ログインしない利用者を Prisma で直接作るときに passwordHash の列へ入れる偽の値（ハッシュでも秘密でもない）。
  apps/api/src/workspaces/messages.test.ts（PR #496 第4巡）と channels.test.ts の `passwordHash: 'argon2id-placeholder'` が
  generic-api-key に当たった。prisma-schema.test.ts の SQL の中の同じ値は当たっていない。上と同じく、値の完全一致だけを除外する。
"""
regexes = [
  '''^leaky-secret-9f3k$''',
  '''^argon2id-placeholder$''',
]
