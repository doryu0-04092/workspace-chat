# 開発環境のミドルウェア（DB・Redis・S3 互換のストレージ）。
#
# アプリ（apps/api / apps/web）はここに入れない。ホットリロードとデバッグのしやすさを
# 優先し、ホストの Node で動かす。起動手順は README.md を参照。
#
# 代償: ローカルとデプロイ先（ECS Fargate）で Node の動作環境が揃わない。
# 「手元では動くが ECS で動かない」がありうる。CI（ubuntu / Node 24）がその差を先に踏む。
#
# 値は .env から読む。compose.yaml にも .env.example にも実際の値は書かない。
# `${VAR:?...}` は未設定・空文字のどちらでも起動を止める。既定値に落とすと、
# 設定の書き忘れが「動いてしまう」形で隠れる。
# **空文字を既定値に落とさない点は README の PORT と同じ。未設定の扱いは違う**
# （PORT は未設定なら 3000 に落ちるが、ここは未設定でも止める）。

# プロジェクト名を固定する。既定はディレクトリ名であり、
# 作業ツリーの置き場所でコンテナ名とボリューム名が変わる。
name: workspace-chat

services:
  db:
    # pg_bigm が要るため公式イメージをそのまま使えない。理由は docker/postgres/Dockerfile。
    build:
      context: ./docker/postgres
    image: workspace-chat-db:local
    # pg_bigm は共有ライブラリの事前読み込みを必須としている（公式ドキュメント）。
    # postgresql.conf を別ファイルで持ち込むより、依存が1行で見える形にする。
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_bigm
    # shm_size は指定しない。/dev/shm は Docker の既定の 64MB のままである。
    # 判断と代償（本番では通る検索がローカルだけで落ちうる）は
    # docs/tech-stack.md「ローカルの PostgreSQL の /dev/shm を広げない」に書いた。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を設定してください}
    ports:
      # 127.0.0.1 に固定する。省略すると 0.0.0.0 で待ち受け、
      # 同じネットワーク上の端末から開発用 DB に届く。
      - '127.0.0.1:${POSTGRES_PORT:?.env に POSTGRES_PORT を設定してください}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    # stop_signal は指定しない。**公式イメージが STOPSIGNAL SIGINT を宣言している**ため、
    # `down` / `stop` は fast shutdown になる（`docker image inspect` で確認した）。
    # ここで SIGINT を書き足しても意味は変わらない。
    # 既定は SIGTERM（PostgreSQL では smart shutdown ＝ 接続が切れるまで待つ）だが、
    # このイメージではそうならない。接続を張ったまま止めても即座に終わり、
    # 次の起動でクラッシュリカバリにならないことを実際に確かめた。
    healthcheck:
      # `docker compose up -d --wait` が起動完了を待てるようにする。
      # $$ は compose の変数展開ではなくコンテナ内のシェルに渡すための書き方。
      #
      # pg_isready ではなく psql で実際に問い合わせる。**pg_isready は利用者も
      # データベースもパスワードも検証しない。** 存在しない利用者を渡しても
      # 「accepting connections」を返して終了コード 0 になる（実行して確認した）。
      #
      # 接続先は 127.0.0.1 ではなく自分のサービス名（db）にする。
      # イメージが作る pg_hba.conf は `host all all 127.0.0.1/32 trust` を持ち、
      # **ループバック宛だとパスワードを検証しない**（これも実行して確認した）。
      # サービス名で引くとブリッジ側の IP になり、`host all all all scram-sha-256`
      # に落ちてパスワードまで検証される。
      #
      # **ここでいうループバックは「コンテナの中の 127.0.0.1」である。**
      # README.md が案内する `127.0.0.1:${POSTGRES_PORT}` は**ホスト側**であり、
      # Docker の NAT を通ってブリッジ側の IP から来たように見えるため、
      # そちらはパスワードが検証される（README.md に確認結果がある）。
      # **この2つを混同して -h 127.0.0.1 に戻さないこと。** 戻すと
      # パスワードのずれを検知しなくなる。
      #
      # ここまでする理由。.env の値は**初回の初期化のときにしか効かない**。
      # 検証しないと、ボリュームが残ったまま値を書き換えた場合に
      # **ヘルスチェックは緑のままアプリだけが繋がらない**、という最も追いにくい形になる。
      #
      # ホスト名を使っても、初期化中の一時サーバーは listen_addresses='' で
      # TCP を開かないため、**初期化の途中で healthy を返す**問題は起きない。
      #
      # ここに書いてあるのは変数の名前であり、値ではない。`docker inspect` の
      # `Config.Healthcheck.Test` にも `$POSTGRES_PASSWORD` の文字列のまま出る。
      #
      # **ただし「docker inspect に秘密が出ない」という意味ではない。**
      # 上の environment: は解決済みの値を渡すため、`Config.Env` には
      # `POSTGRES_PASSWORD=<実際の値>` が平文で出る（実行して確認した）。
      # **その出力を課題や PR に貼らない。**
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      # 初回はイメージのビルドではなく initdb に時間がかかる。余裕を取る。
      retries: 20
      start_period: 30s

  redis:
    # サービス名は redis のまま変えていない（#24 が変えたのはイメージだけ）。
    # 理由・価格の根拠・代償は docs/tech-stack.md「Valkey の版（ローカル）」に記した。
    #
    # このイメージは build: を持たないため、`build --pull` の対象にならない。
    # パッチ修正を受け取るには `docker compose pull redis` が要る（README.md の操作表）。
    # **このイメージも Dependabot で追わないと決めている**（タグごとの経路の一覧は .github/dependabot.yml の末尾）。
    # **このタグは apps/api/src/testing/valkey.ts の VALKEY_IMAGE と同じ**で、そちらは npm test のたびに取り直す。
    # **手元でテストを回さない人には、この `docker compose pull` だけが取り込みの経路になる。**
    #
    # **requirepass を設けない（認証を掛けない）。** 127.0.0.1 にだけ束縛しており、
    # ローカルでは守るものが無い。代償は docs/tech-stack.md に書いた
    # （本番の ElastiCache は AUTH トークンと転送時暗号化を持つため、
    # アプリ側の設定にその経路が一度も現れない）。
    #
    # command / healthcheck の redis-server・redis-cli は、valkey/valkey イメージが持つ
    # Redis 互換のコマンド名（実体は valkey-server・valkey-cli へのシンボリックリンク）である。
    # 実行して確認した（2026-09-06。redis-cli --version は valkey-cli 8.1.10 を返した）。
    image: valkey/valkey:8-alpine
    # 永続化を明示的に切る。用途は Pub/Sub による配信共有と、期限つきのレート制限の回数だけで、
    # データを蓄積しない（docs/tech-stack.md）。
    #
    # 在席はここには入らない。各タスクのメモリにあり、Valkey には保持しない
    # （docs/requirements.md 4.2）。
    #
    # 代償: 再起動で配信の共有が一度切れ、レート制限の回数は数え直しになる。作り直せない状態は無い。
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
    # /data に tmpfs を当てる。匿名ボリュームの対策として要るわけではない
    # （`docker image inspect valkey/valkey:8-alpine --format '{{.Config.Volumes}}'` は null で、
    # このイメージは /data を VOLUME 宣言していない。作成・削除を繰り返しても匿名ボリュームは増えない
    # ことも確認した）。イメージの版が変わって VOLUME 宣言が付いても永続化させないための保証。
    tmpfs:
      - /data
    ports:
      - '127.0.0.1:${REDIS_PORT:?.env に REDIS_PORT を設定してください}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # 添付とアバターの S3 の代わりの S3 互換のストレージ（#427 の決定。手元とテストでは S3 を MinIO で代える）。
    # **手元では署名者と確定の主体を分けない**（api は下の管理者の資格情報1つで読み書きする。分けることの確認は本番で行う）。
    #
    # **このタグは apps/api/src/testing/minio.ts の MINIO_IMAGE と同じ**で、そちらは npm test のたびに取り直す。
    # 手元でテストを回さない人には `docker compose pull minio` だけが取り込みの経路になる（タグごとの経路の一覧は .github/dependabot.yml の末尾）。
    # Docker Hub の minio/minio は取れない（2026-09-17 に Docker Hub の API が 404 を返した）ため、quay.io から取る。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      # 管理者の資格情報。**ローカル専用の使い捨ての値にする。** MinIO は利用者名 3 文字以上・パスワード 8 文字以上を求める。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env に MINIO_ROOT_USER を設定してください}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env に MINIO_ROOT_PASSWORD を設定してください}
      S3_BUCKET: ${S3_BUCKET:?.env に S3_BUCKET を設定してください}
    # 起動のたびにバケットを作り、バージョニングを有効にする（本番の infra/production/attachments.tf のバケットと揃える）。
    # 作り済みなら何もしない（mb --ignore-existing と version enable は何度流してもよい）。mc はこのイメージが同梱している。
    #
    # **踏むと壊れる: バケットを作る処理を、終わって止まる別のサービスに分けない。** `docker compose up -d --wait` は、
    # 終了コード 0 で止まったコンテナがあっても失敗（終了コード 1）を返す（Compose v5.1.4 で確かめた。2026-09-17）。
    # 同じコンテナの中でサーバーを裏で起動し、バケットを作り終えてから印のファイルを置き、healthcheck がその印を見る。
    # シェルが PID 1 になるため、停止のシグナルは trap でサーバーへ渡す（渡さないと stop が猶予の 10 秒を待って強制終了になる）。
    # $$ は compose の変数展開ではなくコンテナ内のシェルに渡すための書き方（db の healthcheck と同じ）。
    entrypoint: ['sh', '-c']
    command:
      - >-
        rm -f /tmp/bucket-ready;
        minio server /data & pid=$$!;
        trap 'kill -TERM "$$pid"' TERM INT;
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
        mc ready local >/dev/null 2>&1; do kill -0 "$$pid" || exit 1; sleep 1; done;
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc version enable "local/$$S3_BUCKET" &&
        touch /tmp/bucket-ready;
        wait "$$pid"; wait "$$pid"
    ports:
      # S3 の API だけを 127.0.0.1 に出す（管理画面のポートは出さない）。
      - '127.0.0.1:${MINIO_PORT:?.env に MINIO_PORT を設定してください}:9000'
    # 名前付きボリュームにする。アバターの行は db-data に残るため、こちらだけ消えると画像の無い行が残る。
    volumes:
      - minio-data:/data
    healthcheck:
      # バケットを作り終えるまでは healthy にしない（`up -d --wait` が、バケットの無いまま戻らないように）。
      test:
        - CMD-SHELL
        - test -f /tmp/bucket-ready && curl --fail --silent http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  # 名前付きボリューム。コンテナを作り直してもデータが残る。
  # 消し方は README.md（`docker compose down -v`）。
  db-data:
  minio-data:
