        判定の順: 絵文字1つでなければ 400 validation_failed → 所属していなければ 404 → 参加していなければパブリックは 403 not_a_channel_member・
        プライベートは 404（オーナーでも同じ）→ そのチャンネルに無い・削除済みのメッセージは 404 → アーカイブ済みのチャンネルは 409 channel_archived →
        そのメッセージに付いている絵文字が 50 種類に達していて、新しい絵文字なら 409 reaction_limit_reached（実装時に決めた値）。
        スレッドの返信にも付けられる。件数はカウンタ列に持ち、付けるのと同じトランザクションで増やす（要件定義書 4.1）。
        変わったら、そのメッセージのリアクションを reaction:changed としてチャンネルの部屋へ配る（機能一覧 5.2）。
        利用者ごとに1分 60 回まで（外すのとは別枠。実装時に決めた値）
      responses:
        '200':
          description: 付けた後の、そのメッセージのリアクション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）か、絵文字の種類の上限（reaction_limit_reached）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: removeReaction
      summary: メッセージから自分のリアクションを外す（F-18）
      description: >-
        自分が付けたものだけを外す。付けていなければ何も変えずに 200 を返す。判定の順は付けるのと同じ（種類の上限を除く）。
        件数は外すのと同じトランザクションで減らし、0 になった絵文字は返さない。
        変わったら、そのメッセージのリアクションを reaction:changed としてチャンネルの部屋へ配る（機能一覧 5.2）。
        利用者ごとに1分 60 回まで（付けるのとは別枠。実装時に決めた値）
      responses:
        '200':
          description: 外した後の、そのメッセージのリアクション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/attachments/uploads:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: createAttachmentUpload
      summary: 添付ファイルのアップロード用の署名付き URL の発行（F-27・F-28）
      description: >-
        チャンネルの添付を上げる署名付き URL を発行する（機能一覧 11.1）。参加者だけが発行できる。コードは2段階: 所属していなければ種別によらず 404。
        所属していて参加していなければ、パブリックは 403 not_a_channel_member・プライベートは 404（オーナーでも参加していなければ同じ）。
        URL の宛先は隔離用のキー quarantine/workspace/{id}/channel/{channelId}/{uploadId}/{保存名} であり、キーはすべてサーバーが組み立てる
        （保存名はファイル名の英数字・.・_・- 以外と先頭の . を _ に置き換え、キー全体が 1,024 バイトに収まるよう切り詰めたもの）。
        有効期限は 5 分で、Content-Type と If-None-Match: * を署名に含む。
        申告した Content-Type が許可リスト（画像 jpeg / png / gif / webp、動画 mp4 / webm、文書 pdf / txt / csv / md / docx / xlsx / pptx、圧縮 zip）に無ければ
        422 unsupported_file_type、種別の上限（画像 10 MB・動画 100 MB・文書と圧縮 25 MB）を超えれば 422 file_too_large。
        申告は信用せず、確定で中身から検証する。利用者単位で 10 分に 30 回まで
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: 発行したアップロード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 受け付けない形式（unsupported_file_type）か、上限を超える大きさ（file_too_large）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/attachments/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: completeAttachmentUpload
      summary: 添付ファイルのアップロードの確定（F-27・F-28）
      description: >-
        本人に払い出され、このワークスペースとチャンネルで発行した識別子だけを確定できる（そうでなければ 404。識別子の存在を認めず、確定の権利も使わない）。
        キーとやり直す参加者判定の対象チャンネルは、発行のときにサーバーが保持した値から組み立てる（機能一覧 11.1）。
        確定の時点で参加者判定をやり直し、落ちたら発行と同じ2段階のコード（404 / 403 not_a_channel_member）を返して隔離用のキーを削除する。
        通れば中身から形式を検証し、検証した版に固定して配信用のキー workspace/{id}/channel/{channelId}/{uploadId}/{保存名} へコピーし、隔離用のキーを削除する
        （保存名の拡張子は検証した形式のものに付け替え、配信の Content-Type と Content-Disposition は検証した形式から決める）。
        検証に通らなければ配信用のキーへ移さず隔離用のキーを削除し、422 を返す——許可リストに無い・中身が形式に合わない（unsupported_file_type）、
        種別の上限を超える（file_too_large）、本体が PUT されていない（upload_not_received）。
        確定は識別子ごとに1回だけ行い、2回目以降はコピーも削除もやり直さず、1回目と同じ結果を返す（参加者判定に落ちたときも同じ。やり直すには発行からやり直す）。
        確定の途中にもう1つ確定を求めると 409 upload_in_progress。確定した添付は、投稿（postMessage）の attachmentIds で投稿に付ける。
        利用者単位で 10 分に 30 回まで
      responses:
        '200':
          description: 確定した添付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: 同じ識別子の確定が進行中（upload_in_progress）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 検証に通らなかった（unsupported_file_type・file_too_large・upload_not_received）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /avatars/cookies:
    post:
      operationId: issueAvatarCookies
      summary: アバターの配信の署名付き Cookie の発行（F-04）
      description: >-
        ログインしている利用者に、CloudFront の /avatars/* に有効な署名付き Cookie を発行する（機能一覧 1.3。ワークスペースやチャンネルの参加を問わない）。
        Cookie は CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id の3つで、Path=/avatars; HttpOnly; Secure; SameSite=Strict。
        期限（expiresIn 秒）より前に取り直す。CloudFront の署名鍵を設定していない環境（手元）では Cookie を発行せず 204 を返す。
        本体は送らない
      responses:
        '200':
          description: 発行した
          headers:
            Set-Cookie:
              description: CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id（Path=/avatars）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedCookiesResponse'
        '204':
          description: CloudFront の署名鍵を設定していない環境であり、Cookie を発行しない
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/files/cookies:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: issueChannelFileCookies
      summary: チャンネルの添付の配信の署名付き Cookie の発行（F-29）
      description: >-
        そのチャンネルの参加者に、CloudFront の /files/workspace/{ws}/channel/{ch}/* に限って有効な署名付き Cookie を発行する（機能一覧 11.2）。
        Cookie は CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id の3つで、Path=/files; HttpOnly; Secure; SameSite=Strict。
        同じ名前・Path の Cookie は上書きされるため、有効なのは最後に発行したチャンネルの分だけである。期限（expiresIn 秒）より前に取り直す。
        コードは参加者一覧と同じ2段階: 所属していなければ種別によらず 404、所属していて参加者でなければパブリックは 403
        not_a_channel_member・プライベートは 404。オーナーの例外は及ばない。アーカイブ済みのチャンネルも、参加者には発行する（読める。機能一覧 3.2）。
        CloudFront の署名鍵を設定していない環境（手元）では、判定を通ったときに Cookie を発行せず 204 を返す。本体は送らない
      responses:
        '200':
          description: 発行した
          headers:
            Set-Cookie:
              description: CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id（Path=/files）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedCookiesResponse'
        '204':
          description: CloudFront の署名鍵を設定していない環境であり、Cookie を発行しない
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: そのチャンネルの参加者でない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations:
    get:
      operationId: listMyInvitations
      summary: 自分宛ての未承諾の招待の一覧（F-38）
      description: 届いた順
      responses:
        '200':
          description: 自分宛ての未承諾の招待
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptInvitation
      summary: 招待の承諾（F-38）
      description: >-
        参加（MEMBER）が成立し、招待は消える。自分宛てでない招待・無い招待は、存在の有無を区別せず 404。
        既にメンバーなら 409 already_member
      responses:
        '200':
          description: 参加したワークスペース（role は MEMBER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            既にメンバーである（already_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: declineInvitation
      summary: 招待の辞退（F-38）
      description: >-
        招待が消える（オーナーは再度招待できる）。自分宛てでない招待・無い招待は、存在の有無を区別せず 404
      responses:
        '204':
          description: 辞退した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      description: ログイン（/auth/login）とリフレッシュ（/auth/refresh）が返すアクセストークン（JWT・HS256）
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: 外す利用者の User.id（ユーザーID ではない）。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      description: チャンネルの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      description: メッセージの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    DmId:
      name: dmId
      in: path
      required: true
      description: DM の id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    Emoji:
      name: emoji
      in: path
      required: true
      description: >-
        リアクションの絵文字1つ（Unicode の RGI_Emoji に当たる列1つ。肌の色・ZWJ で繋いだ列・国旗も1つ。URL エンコードして渡す）。
        絵文字1つでなければ 400。JSON Schema の pattern では文字列の性質を書けないため、絵文字1つかは api が確かめる
      schema:
        type: string
        minLength: 1
        maxLength: 32
    UploadId:
      name: uploadId
      in: path
      required: true
      description: アップロードの識別子（発行の応答の uploadId）。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      description: 招待の id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 通知の id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: id
      in: path
      required: true
      description: ワークスペースの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    RequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: >-
        Cookie を使う要求であることを示す独自のヘッダー。ブラウザは独自のヘッダーを付けた別の origin からの要求に
        プリフライトを求めるため、フォームや画像の読み込みからは送れない（要件定義書 4.3）
      schema:
        type: string
        enum:
          - workspace-chat
  # 複数のパスに共通のエラーの応答。パスに固有の意味を持つもの（403・409 など）はパスに書く。
  responses:
    Unauthorized:
      description: >-
        Authorization ヘッダーが無い、または Bearer 方式でない（authentication_required）か、
        Bearer 方式で資格情報が無い・壊れている・期限切れ・利用者が退会済み（invalid_token。どれに当たったかは区別しない。機能一覧 1.4）。
        アクセストークンはリフレッシュ（/auth/refresh）で取り直す。仕様の形の検証（400）はトークンの確認より先に行う（仕様で書けない検証は後に行う）
      headers:
        WWW-Authenticate:
          description: >-
            Authorization ヘッダーが無い・Bearer 方式でないときは `Bearer`、Bearer 方式で資格情報が無い・使えないときは `Bearer error="invalid_token"`（RFC 6750 3.1）
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfRejected:
      description: >-
        Sec-Fetch-Site・Origin・Referer のどれも、api と同じ origin からの要求であることを示さない（csrf_rejected）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: >-
        入力が仕様に合わない（validation_failed）か、本体を JSON として読めない（invalid_body）。
        どちらも送られた値を応答に載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 仕様に無いメソッド（method_not_allowed）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 本体が大きすぎる（payload_too_large。上限は Nest の JSON の読み取りの既定の 100kb）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 仕様に無いメディア型の本体（unsupported_media_type）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: レート制限を超えた（too_many_requests。上限はパスの説明に書く）
      headers:
        Retry-After:
          description: 再び受け付けるまでの秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        見つからない（not_found）。所属していないワークスペースは、存在の有無を区別せずこれになる（機能一覧 2.1・1.4）。
        本体は状態コードの本体であり、権限の有無を述べない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 想定外の失敗（internal_error）。例外のメッセージは載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          description: >-
            エラーの種類。api が返す値はこの列挙だけであり、api と web は生成した型で同じ列挙を使う
            （綴りを誤ると型検査で落ちる）
          type: string
          enum:
            - validation_failed
            - invalid_body
            - not_found
            - method_not_allowed
            - payload_too_large
            - unsupported_media_type
            - too_many_requests
            - user_id_taken
            - registration_disabled
            - invalid_credentials
            - authentication_required
            - invalid_token
            - csrf_rejected
            - owner_only
            - invitee_not_found
            - already_invited
            - already_member
            - owner_cannot_leave
            - password_mismatch
            - owner_cannot_delete_account
            - pin_limit_reached
            - channel_name_taken
            - not_a_channel_member
            - already_channel_member
            - channel_archived
            - channel_not_private
            - channel_not_archived
            - not_message_author
            - dm_with_self
            - dm_counterpart_not_found
            - dm_counterpart_unavailable
            - reaction_limit_reached
            - unsupported_file_type
            - file_too_large
            - upload_not_received
            - upload_in_progress
            - attachment_unavailable
            - request_rejected
            - internal_error
        message:
          type: string
        errors:
          description: 入力の検証で落ちた箇所。送られた値は含めない
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - password
        - displayName
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（機能一覧 1.1）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        password:
          description: >-
            8〜128文字（機能一覧 1.1。上限は決定・2026-09-11・依頼側）。文字数はコードポイントで数える
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          description: 1〜50文字。空白だけは不可（機能一覧 1.1。決定・2026-09-11・依頼側。列の型にも入れてある）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - recoveryCode
        - newPassword
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（RegisterRequest と同じ）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        recoveryCode:
          description: >-
            登録で受け取ったコード。英小文字・ハイフンの有無を問わない（照合の前に正規形へ寄せる。O は 0、I・L は 1 と読む）
          type: string
          pattern: '^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$'
        newPassword:
          description: 8〜128文字（RegisterRequest の password と同じ）
          type: string
          minLength: 8
          maxLength: 128
    RecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - recoveryCode
      properties:
        recoveryCode:
          description: 新しいリカバリーコード。Crockford の Base32 で16文字（80ビット）を4文字ずつハイフンで区切る
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - recoveryCode
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        recoveryCode:
          description: Crockford の Base32 で16文字（80ビット）を4文字ずつハイフンで区切る
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - password
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（RegisterRequest と同じ）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        password:
          description: >-
            1〜128文字。下限を登録（8文字）に揃えないのは、下限を変えたときに既存の利用者がログインできなくならないようにするため
          type: string
          minLength: 1
          maxLength: 128
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          description: JWT（HS256）。Authorization ヘッダーに Bearer で付ける
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: アクセストークンの有効期間（秒）
          type: integer
    SignedCookiesResponse:
      description: 発行した CloudFront の署名付き Cookie の有効期間
      type: object
      additionalProperties: false
      required:
        - expiresIn
      properties:
        expiresIn:
          description: 署名付き Cookie の有効期間（秒）。これより前に取り直す
          type: integer
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          description: JWT（HS256）。Authorization ヘッダーに Bearer で付ける
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: アクセストークンの有効期間（秒）
          type: integer
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          description: アバター画像の配信 URL のパス。無ければ null。**退会した利用者は null**（機能一覧 1.3・1.5）
          type:
            - string
            - 'null'
    UserSettings:
      description: >-
        利用者ごとの設定（F-23。機能一覧 10.1）。**プロフィール（Profile）とは分ける**——
        プロフィールが持つのは他人に見える情報であり、設定は本人にしか返さない。
        通知の設定（F-24・F-25）が増えたら、ここに足す
      type: object
      additionalProperties: false
      required:
        - threadUnreadIncluded
      properties:
        threadUnreadIncluded:
          description: >-
            スレッド内の未読を、チャンネルの未読に含めるか（既定は含める）。
            切り替えても既読位置は動かさないため、「含めない」→「含める」で過去の未読の返信が未読として現れる（機能一覧 10.1）
          type: boolean
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          description: 今のパスワード。1〜128文字（LoginRequest の password と同じ）
          type: string
          minLength: 1
          maxLength: 128
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        threadUnreadIncluded:
          description: 送った項目だけを変える（機能一覧 10.1）
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - avatarUrl
        - status
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
        status:
          description: 絵文字とテキストの1セット。設定していなければ null（機能一覧 1.3）
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
    Status:
      description: >-
        ステータス（機能一覧 1.3）。絵文字とテキストは1セットであり、片方だけは持たない（決定・2026-09-12・依頼側。#283）
      type: object
      additionalProperties: false
      required:
        - emoji
        - text
      properties:
        emoji:
          description: >-
            絵文字1つ（Unicode の RGI_Emoji に当たる列1つ。肌の色や ZWJ で繋いだ列・国旗も1つと数える）。
            この形は pattern で表せないため、api が確かめて 400（validation_failed）を返す
          type: string
        text:
          description: 1〜100文字（文字数はコードポイントで数える）
          type: string
          minLength: 1
          maxLength: 100
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          description: 1〜50文字。空白だけは不可（RegisterRequest と同じ）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
        status:
          description: 絵文字とテキストの1セットで設定する。null で消す（片方だけの本体は 400）
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
    UploadRequest:
      description: >-
        アップロードの発行の要求（機能一覧 11.1）。どれも申告であり、形式と大きさは確定で中身から検証する。
        キー・パス・URL は指定できない（サーバーが組み立てる）
      type: object
      additionalProperties: false
      required:
        - fileName
        - contentType
        - size
      properties:
        fileName:
          description: 元のファイル名（1〜255 文字）。保存名はこれを置き換えて作る
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          description: >-
            申告する Content-Type。許可リスト（packages/shared の UPLOAD_FORMATS）の値でなければ 422 unsupported_file_type。
            署名付き URL の PUT には、この値をそのまま Content-Type に付ける
          type: string
          minLength: 1
          maxLength: 255
        size:
          description: 申告する大きさ（バイト）。種別の上限を超えれば 422 file_too_large
          type: integer
          minimum: 1
    UploadTicket:
      description: 発行したアップロード（機能一覧 11.1）
      type: object
      additionalProperties: false
      required:
        - uploadId
        - uploadUrl
        - uploadHeaders
        - expiresAt
      properties:
        uploadId:
          description: アップロードの識別子。確定の要求に使う
          type: string
          format: uuid
        uploadUrl:
          description: 本体を PUT する署名付き URL（宛先は隔離用のキー）
          type: string
        uploadHeaders:
          description: PUT に付けるヘッダー。どちらも署名に含まれ、変えたり外したりすると断られる
          type: object
          additionalProperties: false
          required:
            - Content-Type
            - If-None-Match
          properties:
            Content-Type:
              type: string
            If-None-Match:
              type: string
              enum:
                - '*'
        expiresAt:
          description: 署名付き URL の有効期限（発行から 5 分）。この時刻までに PUT を始める
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: >-
            1〜50 文字（文字数はコードポイントで数える）。空白だけは不可（決定・2026-09-12・依頼側。#290）。
            上限は入力にだけ置く（応答と DB の列には置かない。同決定）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
    WorkspaceRole:
      description: ワークスペースでの役割（schema.prisma の WorkspaceRole）
      type: string
      enum:
        - OWNER
        - MEMBER
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        role:
          description: 要求した利用者の、このワークスペースでの役割
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceMember:
      description: 参加者。UserSummary に役割を足したもの
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - avatarUrl
        - role
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          description: UserSummary の avatarUrl と同じ
          type:
            - string
            - 'null'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    ChannelVisibility:
      description: チャンネルの種別（schema.prisma の ChannelVisibility）
      type: string
      enum:
        - PUBLIC
        - PRIVATE
    UpdateChannelReadRequest:
      type: object
      additionalProperties: false
      required:
        - lastReadMessageId
      properties:
        lastReadMessageId:
          description: >-
            読んだ位置（そのチャンネルのメッセージの id。F-23。機能一覧 10.1）。
            既読位置は戻さないため、いま持っている位置より古い id を渡しても既読位置は変わらない
          type: string
          format: uuid
    CreateChannelRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - visibility
      properties:
        name:
          description: >-
            1〜50 文字（文字数はコードポイントで数える）。空白だけは不可（決定・2026-09-12・依頼側。#290）。
            上限は入力にだけ置く（アーカイブ時の接尾辞 -<採番> はこの外側に付くため、応答と DB の列には置かない。同決定）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
    CreateMessageRequest:
      description: >-
        チャンネルへの投稿の本体（機能一覧 4.1）。確定した添付を最大 10 件付けられる。
        本文は 4000 文字まで。添付が無ければ PostMessageRequest と同じく 1 文字以上で空白だけは不可、
        添付が 1 件以上あれば空・空白だけでもよい（画像だけの投稿。#614）
      type: object
      additionalProperties: false
      required:
        - body
      # 添付が1件以上あれば本文は空でもよい。無ければ 1 文字以上で空白だけは不可（#614）。
      # anyOf で書くと生成する型が緩い和になるため、if/then/else で書く（型は properties のまま）
      if:
        required:
          - attachmentIds
        properties:
          attachmentIds:
            minItems: 1
      else:
        properties:
          body:
            minLength: 1
            pattern: '\S'
      properties:
        body:
          description: 4000 文字まで（文字数はコードポイントで数える）。添付が無ければ 1 文字以上で空白だけは不可（機能一覧 4.1・#614）
          type: string
          maxLength: 4000
        attachmentIds:
          description: >-
            付ける添付の識別子（確定の応答の id）。自分が上げ、このチャンネルで確定に成功し、まだどの投稿にも付いていないものだけを付けられる
            （1つでも当たらなければ 422 attachment_unavailable で、投稿しない）。並びは上げた順になる
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    Attachment:
      description: 添付ファイル（機能一覧 11.1・11.2）
      type: object
      additionalProperties: false
      required:
        - id
        - fileName
        - contentType
        - kind
        - size
        - url
      properties:
        id:
          description: アップロードの識別子
          type: string
          format: uuid
        fileName:
          description: 利用者が付けた元のファイル名（表示用。保存名とは違う）
          type: string
        contentType:
          description: 配信の Content-Type（検証した形式からサーバーが決めた値。テキスト系は text/plain; charset=utf-8）
          type: string
        kind:
          description: 種別（画像は表示し、動画は #t=30 の位置を表示し、それ以外はリンクにする。機能一覧 11.1）
          type: string
          enum:
            - image
            - video
            - document
            - archive
        size:
          description: 大きさ（バイト）
          type: integer
          minimum: 1
        url:
          description: >-
            配信 URL のパス（/files/workspace/{workspaceId}/channel/{channelId}/{id}/{保存名}）。CloudFront の署名付き Cookie で取得する（機能一覧 11.2）
          type: string
    PostMessageRequest:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          description: 1〜4000 文字（文字数はコードポイントで数える）。空白だけは不可（機能一覧 4.1）
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '\S'
    Message:
      description: チャンネルのメッセージ（機能一覧 4.1・4.2）
      type: object
      additionalProperties: false
      required:
        - id
        - channelId
        - author
        - body
        - createdAt
        - editedAt
        - deleted
        - parentId
        - replyCount
        - replyParticipants
        - mentions
        - reactions
        - attachments
      properties:
        id:
          description: UUIDv7。一覧のカーソル（before）にそのまま使う
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        parentId:
          description: スレッドの親の id。チャンネルの本体のメッセージなら null（機能一覧 6）
          type:
            - string
            - 'null'
          format: uuid
        replyCount:
          description: 削除されていない返信の件数。返信なら常に 0（返信はスレッドを持たない。機能一覧 6）
          type: integer
          minimum: 0
        replyParticipants:
          description: >-
            返信した参加者。削除されていない返信を書いた、退会していない利用者を、最後に返信した順に最大3人（機能一覧 6）。
            返信と、返信の無いメッセージは空
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/UserSummary'
        author:
          description: 投稿者。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        body:
          description: 本文。削除済みなら null（本文は DB に残るが返さない。機能一覧 4.2）
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        editedAt:
          description: 最後に編集した時刻。編集していなければ null（「編集済み」の表示に使う。機能一覧 4.2）
          type:
            - string
            - 'null'
          format: date-time
        deleted:
          description: 削除済みか（「このメッセージは削除されました」に置き換えて表示する。機能一覧 4.2）
          type: boolean
        mentions:
          description: >-
            本文のメンションの対象（機能一覧 9.1）。投稿・返信のときに、そのチャンネルの参加者で退会していない利用者へ解決できた
            `@ユーザーID` を保存し、本文に最初に現れた順に1人1件で載せる。編集では、本文にユーザーID が残っている対象は解決し直さずに残す
            （チャンネルを抜けた・退会した対象も残り、退会した対象は user が null）。本文から消えた対象は外し、新しく書いた `@` は投稿と同じく解決して足す。
            削除済みのメッセージは空
          type: array
          items:
            $ref: '#/components/schemas/MessageMention'
        reactions:
          description: >-
            リアクション（機能一覧 7）。絵文字ごとに1件で、その絵文字を初めて付けた順。削除済みのメッセージは空
            （本文を返さないのと同じく返さない。付けた記録は DB に残る）
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Reaction'
        attachments:
          description: >-
            投稿に付けた添付（上げた順）。削除済みのメッセージは空（本文を返さないのと同じく返さない。機能一覧 4.2）
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    Reaction:
      description: 1つの絵文字のリアクション（機能一覧 7）
      type: object
      additionalProperties: false
      required:
        - emoji
        - count
        - users
      properties:
        emoji:
          description: 絵文字1つ
          type: string
        count:
          description: >-
            付けた人数（カウンタ列。一覧で COUNT を発行しない。要件定義書 4.1）。退会した利用者の分も数える
          type: integer
          minimum: 1
        users:
          description: >-
            付けた人（「誰が付けたか」をホバーで出す。機能一覧 7）。付けた順。退会した利用者は含めない
            （そのため count より少ないことがある）
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    MessageReactions:
      description: 1つのメッセージのリアクション（付け外しの応答。reaction:changed の payload も同じ項目に送信時刻を足す）
      type: object
      additionalProperties: false
      required:
        - channelId
        - messageId
        - reactions
      properties:
        channelId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        reactions:
          description: Message.reactions と同じ
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Reaction'
    MessageMention:
      description: メンションの対象（表示時の参照先。機能一覧 9.1 の経路2。対象がいまそのチャンネルの参加者かは問わない）
      type: object
      additionalProperties: false
      required:
        - userId
        - user
      properties:
        userId:
          description: 対象のユーザーID（登録したときの大文字小文字のまま）。本文の `@ユーザーID` とは大文字小文字によらず照合する（機能一覧 1.1）
          type: string
        user:
          description: 対象の利用者。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
    MessagePage:
      type: object
      additionalProperties: false
      required:
        - messages
        - nextBefore
      properties:
        messages:
          description: 新しい順
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextBefore:
          description: 続きを取るときに before に渡す id。続きが無ければ null
          type:
            - string
            - 'null'
          format: uuid
    SearchResult:
      description: >-
        検索の結果（機能一覧 12.1）。種別ごとのセクションを持つ。DM（F-19）とファイル（F-27）のセクションは、それぞれの実装で足す
      type: object
      additionalProperties: false
      required:
        - messages
        - channels
        - users
      properties:
        messages:
          description: 新しい順。最大20件
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SearchMessage'
        channels:
          description: 名前の順。最大20件
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SearchChannel'
        users:
          description: ユーザーID の小文字の順。最大20人
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserSummary'
    SearchMessage:
      description: 検索に当たったメッセージ。本文は削除されていないものだけが当たるため、常にある
      type: object
      additionalProperties: false
      required:
        - id
        - channel
        - parentId
        - author
        - body
        - createdAt
        - editedAt
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/SearchChannel'
        parentId:
          description: スレッドの返信なら親の id。チャンネルの本体のメッセージなら null（機能一覧 6）
          type:
            - string
            - 'null'
          format: uuid
        author:
          description: 投稿者。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
            - string
            - 'null'
          format: date-time
    SearchChannel:
      description: 検索に当たったチャンネルと、メッセージが属するチャンネル
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - archived
        - joined
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
        archived:
          type: boolean
        joined:
          description: 要求した利用者がこのチャンネルに参加しているか（メッセージのチャンネルは常に true）
          type: boolean
    PinnedMessage:
      description: ピン留めしたメッセージ（機能一覧 13.2）
      type: object
      additionalProperties: false
      required:
        - message
        - pinnedBy
        - pinnedAt
      properties:
        message:
          $ref: '#/components/schemas/Message'
        pinnedBy:
          description: ピン留めした人。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        pinnedAt:
          description: ピン留めした時刻
          type: string
          format: date-time
    PinList:
      type: object
      additionalProperties: false
      required:
        - pins
      properties:
        pins:
          description: ピン留めした新しい順
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PinnedMessage'
    Channel:
      description: >-
        一般の一覧（参加者向け）のチャンネル。作成（201）と、自分が参加しているアーカイブ済みの一覧
        （GET /workspaces/{id}/archived-channels）の応答にも使う
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - joined
        - joinedAt
        - unread
        - mentions
        - lastReadMessageId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
        joined:
          description: 要求した利用者がこのチャンネルに参加しているか
          type: boolean
        joinedAt:
          description: >-
            要求した利用者がこのチャンネルに参加した時刻（F-23。機能一覧 10.1）。参加していなければ null。
            **既読位置をまだ持たない利用者の「ここから未読」の区切り線を、この時刻より後の最初のメッセージの上に出すために要る**——
            未読数から位置を数えてはならないため、境目は時刻か id でしか決められない
          type:
            - string
            - 'null'
          format: date-time
        unread:
          description: >-
            要求した利用者の未読数（F-23。機能一覧 10.1）。既読位置からの差分で求め、自分の投稿と削除済みは数えない。
            既読位置をまだ持たない利用者は、参加した時点より後だけを数える。参加していないパブリックチャンネルは常に 0
          type: integer
          minimum: 0
        mentions:
          description: >-
            要求した利用者のメンションの件数（F-24。機能一覧 10.2）。**未読のうち、要求した利用者をメンションしているもの**を数える
            ——`unread` と同じ条件で数えるため、常に `unread` 以下であり、既読を進めると一緒に減る。
            `@channel` は参加者全員に、`@here` は受け取りを返した利用者にだけ数える（F-21。機能一覧 9.2）。参加していないチャンネルは常に 0
          type: integer
          minimum: 0
        lastReadMessageId:
          description: >-
            要求した利用者の既読位置（F-23。機能一覧 10.1）。「ここから未読」の区切り線を、この次のメッセージの上に出す。
            まだ既読位置を持たない利用者と、参加していないチャンネルでは null（線は、参加した時点より後の最初のメッセージの上に出す）。
            未読数から位置を数えてはならない——自分の投稿と削除済みは未読に数えないが、一覧には並ぶため必ずずれる
          type:
            - string
            - 'null'
          format: uuid
    ManagedChannel:
      description: >-
        オーナーの管理用の一覧の項目。持つのはこれだけで、メッセージ・添付ファイル・未読数・在席は持たない（機能一覧 3.1 の但し書き）
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - memberCount
        - archived
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
        memberCount:
          description: 参加者の数。退会済みの利用者を含めない（機能一覧 1.5）
          type: integer
          minimum: 0
        archived:
          description: アーカイブ済みか（管理用の一覧はアーカイブ済みも含める。含めないと復元の経路が無くなる。F-35）
          type: boolean
    InviteChannelMemberRequest:
      type: object
      additionalProperties: false
      required:
        - memberId
      properties:
        memberId:
          description: 招待する利用者の User.id（ワークスペースの参加者一覧が返す id。ユーザーID ではない）
          type: string
          format: uuid
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          description: 招待する利用者のユーザーID（大文字小文字を区別しない。形は登録と同じ英数字と _ の 3〜30 文字）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
    Invitation:
      description: 作った招待（招待したオーナーに返す）
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - invitee
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        invitee:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
    MyInvitation:
      description: 自分宛ての未承諾の招待
      type: object
      additionalProperties: false
      required:
        - id
        - workspace
        - invitedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        invitedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
    StartDmRequest:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          description: 相手の User.id（ワークスペースの参加者一覧が返す id。ユーザーID ではない）
          type: string
          format: uuid
    UpdateDmReadRequest:
      type: object
      additionalProperties: false
      required:
        - lastReadMessageId
      properties:
        lastReadMessageId:
          description: >-
            読んだ位置（その DM のメッセージの id。F-23。機能一覧 10.1）。
            既読位置は戻さないため、いま持っている位置より古い id を渡しても既読位置は変わらない
          type: string
          format: uuid
    Dm:
      description: 自分が当事者の DM（機能一覧 8・10.1）
      type: object
      additionalProperties: false
      required:
        - id
        - counterpart
        - writable
        - joinedAt
        - unread
        - lastReadMessageId
      properties:
        id:
          type: string
          format: uuid
        counterpart:
          description: 相手。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        writable:
          description: >-
            相手がいまこのワークスペースの退会していないメンバーか。false なら投稿できない（409 dm_counterpart_unavailable。機能一覧 8）。
            過去のメッセージは読める
          type: boolean
        joinedAt:
          description: >-
            要求した利用者がこのワークスペースに参加した時刻（F-23。機能一覧 10.1）。既読位置をまだ持たないとき、
            未読はこの時刻より後のメッセージだけを数え、「ここから未読」の区切り線もこの時刻より後の最初のメッセージの上に出す
          type: string
          format: date-time
        unread:
          description: >-
            要求した利用者の未読数（F-23。機能一覧 10.1）。既読位置からの差分で求め、自分の投稿と削除済みは数えない。
            既読位置をまだ持たない利用者は、joinedAt より後だけを数える
          type: integer
          minimum: 0
        lastReadMessageId:
          description: >-
            要求した利用者の既読位置（F-23。機能一覧 10.1）。「ここから未読」の区切り線を、この次のメッセージの上に出す。
            まだ既読位置を持たなければ null。未読数から線の位置を数えてはならない
          type:
            - string
            - 'null'
          format: uuid
    DmMessage:
      description: DM のメッセージ（機能一覧 8・4.2）
      type: object
      additionalProperties: false
      required:
        - id
        - dmId
        - author
        - body
        - createdAt
        - editedAt
        - deleted
      properties:
        id:
          description: UUIDv7。一覧のカーソル（before）にそのまま使う
          type: string
          format: uuid
        dmId:
          type: string
          format: uuid
        author:
          description: 書き手。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        body:
          description: 本文。削除済みなら null（本文は DB に残るが返さない。機能一覧 4.2）
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        editedAt:
          description: 最後に編集した時刻。編集していなければ null（機能一覧 4.2）
          type:
            - string
            - 'null'
          format: date-time
        deleted:
          description: 削除済みか（機能一覧 4.2）
          type: boolean
    DmMessagePage:
      type: object
      additionalProperties: false
      required:
        - messages
        - nextBefore
      properties:
        messages:
          description: 新しい順
          type: array
          items:
            $ref: '#/components/schemas/DmMessage'
        nextBefore:
          description: 続きを取るときに before に渡す id。続きが無ければ null
          type:
            - string
            - 'null'
          format: uuid

    NotificationKind:
      description: >-
        通知の種類（機能一覧 10.3）。MENTION はチャンネルのメッセージのメンション（個人・@channel・受け取りを返した @here）、
        DM は DM で受け取ったメッセージ（#623）
      type: string
      enum:
        - MENTION
        - DM
    Notification:
      description: 受け取った通知（機能一覧 10.3）。kind で、チャンネルの通知か DM の通知かを見分ける（#623）
      oneOf:
        - $ref: '#/components/schemas/ChannelNotification'
        - $ref: '#/components/schemas/DmNotification'
      discriminator:
        propertyName: kind
        mapping:
          MENTION: '#/components/schemas/ChannelNotification'
          DM: '#/components/schemas/DmNotification'
    ChannelNotification:
      description: チャンネルのメッセージのメンションの通知（機能一覧 10.3）
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - createdAt
        - readAt
        - workspace
        - channel
        - message
      properties:
        id:
          description: UUIDv7。一覧のカーソル（before）にそのまま使う
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - MENTION
        createdAt:
          description: 通知を作った時刻（メンションを保存した時刻。編集で足したメンションなら編集の時刻）
          type: string
          format: date-time
        readAt:
          description: 既読にした時刻。未読なら null
          type:
            - string
            - 'null'
          format: date-time
        workspace:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        channel:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        message:
          description: メンションしたメッセージ（チャンネルの一覧と同じ形。返信なら parentId を持つ）
          $ref: '#/components/schemas/Message'
    DmNotification:
      description: DM で受け取ったメッセージの通知（機能一覧 10.2・10.3。#623）。宛先は DM の相手だけ（書き手本人には作らない）
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - createdAt
        - readAt
        - workspace
        - dm
        - message
      properties:
        id:
          description: UUIDv7。一覧のカーソル（before）にそのまま使う（チャンネルの通知と同じ並びに混ぜる）
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - DM
        createdAt:
          description: 通知を作った時刻（DM を受け取った時刻）
          type: string
          format: date-time
        readAt:
          description: 既読にした時刻。未読なら null
          type:
            - string
            - 'null'
          format: date-time
        workspace:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        dm:
          type: object
          additionalProperties: false
          required:
            - id
            - counterpart
          properties:
            id:
              type: string
              format: uuid
            counterpart:
              description: 相手（書き手）。退会した利用者なら null
              oneOf:
                - $ref: '#/components/schemas/UserSummary'
                - type: 'null'
        message:
          description: 受け取った DM のメッセージ（DM の一覧と同じ形）
          $ref: '#/components/schemas/DmMessage'
    NotificationPage:
      type: object
      additionalProperties: false
      required:
        - notifications
        - nextBefore
      properties:
        notifications:
          description: 新しい順
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextBefore:
          description: 続きを取るときに before に渡す id。続きが無ければ null
          type:
            - string
            - 'null'
          format: uuid
