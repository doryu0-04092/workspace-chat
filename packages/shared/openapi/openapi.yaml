# REST API の仕様。これが唯一の正であり、型はここから生成する（要件定義書 4.7）。
# 変更したら `npm run generate:api` で packages/shared/src/api.gen.ts を作り直す。
# 作り直さずに push すると、CI（code）の「REST の型が仕様と一致することの確認」が落ちる。
openapi: 3.1.0
info:
  title: workspace-chat API
  version: 0.0.0
  description: >-
    エラーの応答の本体はすべて ErrorResponse である。仕様に無いパス（前置き /api の外を含む）は
    404（not_found）を返し、パスごとには載せない。
servers:
  # 全ルートの前置きは /api（#77 の決定。apps/api/src/app-setup.ts の createApp が付ける）。
  - url: /api
# 既定ですべての操作にアクセストークンを求める。認証を要さない操作だけが `security: []` で外す
# （api 側は auth/access-token.guard.ts が同じ既定を持つ。一致は auth/access-token.test.ts が仕様を読んで確かめる）。
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 死活確認（F-39）
      description: 認証を要さない。DB・Redis 等に問い合わせない（機能一覧 14.1）。
      security: []
      responses:
        '200':
          description: 稼働している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      operationId: register
      summary: 新規登録（F-01 / F-03 / F-37）
      description: >-
        認証を要さない。登録と同時にログイン状態にはしない（トークンは返さない）。
        リカバリーコードはこの応答でだけ返し、以後は再表示できない（機能一覧 1.1）。
        発信元単位のレート制限は1時間に10回（機能一覧 1.1）。201・403・409 の要求も1回として数え、
        入力の検証で落ちた要求（400）は数えない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 新規登録を停止している（registration_disabled。要件定義書 5.1）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            ユーザーID が既に使われている（user_id_taken。大文字小文字だけの違いも同じ ID と見なす）。
            代償: どのユーザーID が登録済みかがこの応答で分かり、列挙に使える（ログインは区別しない。機能一覧 1.2）。
            利用者が別の ID を選び直せることを優先した。列挙は発信元単位のレート制限（429）で抑える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: login
      summary: ログイン（F-02）
      description: >-
        認証を要さない。成功するとアクセストークン（JWT・15分）を本体で返し、リフレッシュトークン（14日）を
        Cookie（refresh_token。HttpOnly; Secure; SameSite=Strict; Path=/api/auth）で渡す（機能一覧 1.2）。
        発信元単位のレート制限は15分に20回。加えてユーザーID（大文字小文字を区別しない。存在しない ID も同じ）ごとに、
        連続して失敗した回数 n に対し 2^(n-1) 秒（上限 900 秒）の間は照合せずに 429 を返す。成功で数え直す（リカバリーコードによる再設定の成功でも数え直す。#280）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              description: リフレッシュトークン（refresh_token）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            ユーザーID かパスワードが違う、または退会済み（invalid_credentials）。どれに当たったかは区別しない（機能一覧 1.2）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: アクセストークンの更新（F-02）
      description: >-
        新しいアクセストークンを返す。Cookie（refresh_token）のリフレッシュトークンは、発行から1日を過ぎていれば新しいものに入れ替える
        （1日以内は入れ替えず、Set-Cookie を返さない。機能一覧 1.2）。
        入れ替え済みのトークンが出されたら、そのログインの系列のトークンをすべて失効させる（RFC 9700 4.14.2）。
        本体は送らない。X-Requested-By が無い要求は 400、Sec-Fetch-Site / Origin / Referer が同じ origin を示さない要求は 403
        （要件定義書 4.3 の CSRF の対処）。発信元単位のレート制限は15分に60回（機能一覧 1.2）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedBy'
      responses:
        '200':
          description: 新しいアクセストークン
          headers:
            Set-Cookie:
              description: 入れ替えたときだけ、新しいリフレッシュトークン（refresh_token）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            リフレッシュトークンが無い・知らない・失効済み・期限切れ、または利用者が退会済み（invalid_token）。
            どれに当たったかは区別しない。Cookie を消す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logout
      summary: ログアウト（F-02）
      description: >-
        Cookie（refresh_token）のリフレッシュトークンの系列をすべて失効させ、Cookie を消す（機能一覧 1.2）。
        トークンが無い・知らない場合も 204 を返す。本体は送らない。CSRF の対処は /auth/refresh と同じ。
        発信元単位のレート制限は15分に60回（機能一覧 1.2）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedBy'
      responses:
        '204':
          description: ログアウトした（Cookie を消す）
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/recovery:
    post:
      operationId: recover
      summary: リカバリーコードによるパスワードの再設定（F-37）
      description: >-
        認証を要さない。ユーザーID とリカバリーコードでパスワードを再設定し、使ったコードを無効化して新しいコードを発行する
        （新しいコードはこの応答でだけ返す）。その利用者のリフレッシュトークンをすべて失効させる（機能一覧 1.1）。
        発信元単位のレート制限は1時間に10回。加えてユーザーID（大文字小文字を区別しない。存在しない ID も同じ）ごとに、
        連続して失敗した回数 n に対し 2^(n-1) 秒（上限 900 秒）の間は照合せずに 429 を返す（ログインとは別に数える。ただし再設定に成功したら、ログインの回数も数え直す。#280）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: 再設定した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            ユーザーID かリカバリーコードが違う、コードが使用済み、または退会済み（invalid_credentials）。どれに当たったかは区別しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      operationId: getMyProfile
      summary: 自分のプロフィールの取得（F-04）
      description: >-
        アバター画像の設定はまだ無く、avatarUrl は null のままである（機能一覧 1.3。11.1 と同じ段で足す）。
      responses:
        '200':
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateMyProfile
      summary: 自分のプロフィールの編集（F-04）
      description: >-
        送った項目だけを変える。ユーザーID は変えられない（本体に userId を含めると 400。機能一覧 1.3）。
        ステータスは絵文字とテキストの1セットで、null を送ると消える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 変えた後のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces:
    post:
      operationId: createWorkspace
      summary: ワークスペースの作成（F-06）
      description: >-
        作成者がオーナーとして所属した状態になる（機能一覧 2.1）。名前は 1〜50 文字（コードポイント）で、空白だけは不可。
        同名を許す（決定・2026-09-12・依頼側。#290）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: 作ったワークスペース（role は OWNER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listMyWorkspaces
      summary: 自分が所属するワークスペースの一覧（F-06。サイドバーの切替）
      description: 参加した順。所属していないものは含まない
      responses:
        '200':
          description: 所属するワークスペース
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: ワークスペースの取得（F-06）
      description: 所属していなければ、存在の有無を区別せず 404（機能一覧 2.1）
      responses:
        '200':
          description: ワークスペース
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceMembers
      summary: ワークスペースの参加者一覧（F-06）
      description: >-
        参加した順。退会済みの利用者を含まない（機能一覧 2.1・1.5）。所属していなければ、存在の有無を区別せず 404
      responses:
        '200':
          description: 参加者
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      operationId: kickWorkspaceMember
      summary: ワークスペースからのキック（F-09）
      description: >-
        オーナーだけ（メンバーは 403 owner_only、所属していなければ存在の有無を区別せず 404）。オーナー自身は外せない（403 owner_cannot_leave）。
        外す相手がメンバーでなければ 404。キックされた利用者は、そのワークスペースの全チャンネルから外れる（機能一覧 2.2）
      responses:
        '204':
          description: 外した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            オーナーでない（owner_only）か、オーナーが自分を外そうとした（owner_cannot_leave）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: leaveWorkspace
      summary: ワークスペースからの退出（F-38）
      description: >-
        メンバー本人が抜ける。オーナーは退出できない（403 owner_cannot_leave。理由のメッセージを返す）。
        所属していなければ存在の有無を区別せず 404。退出した利用者は、そのワークスペースの全チャンネルから外れる（機能一覧 F-38）
      responses:
        '204':
          description: 抜けた
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: オーナーは退出できない（owner_cannot_leave）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: inviteToWorkspace
      summary: ワークスペースへの招待（F-08）
      description: >-
        オーナーだけが招待できる（メンバーは 403 owner_only、所属していなければ存在の有無を区別せず 404）。
        宛先はユーザーID で、大文字小文字を区別せず、退会済みは解決しない（解決できなければ 422 invitee_not_found）。
        同じ利用者への未承諾の招待が既にあれば 409 already_invited、既にメンバーなら 409 already_member。招待に期限は無い。
        招待したら、招待された利用者へリアルタイムの invitation:new を送る（機能一覧 2.2・F-38。決定・2026-09-12・依頼側。#326）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 作った招待
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            オーナーでない（owner_only）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            同じ利用者への未承諾の招待が既にある（already_invited）か、既にメンバーである（already_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            宛先のユーザーID の利用者がいない、または退会済み（invitee_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listChannels
      summary: チャンネル一覧（F-10）
      description: >-
        パブリックと、自分が参加しているプライベートだけを返す。アーカイブ済みは含めない。名前の順（機能一覧 3.1・3.2）。
        オーナーでも、参加していないプライベートチャンネルは含めない（管理用の一覧は /workspaces/{id}/managed-channels）。
        所属していなければ、存在の有無を区別せず 404
      responses:
        '200':
          description: 見えるチャンネル
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createChannel
      summary: チャンネルの作成（F-10）
      description: >-
        オーナーだけ（メンバーは 403 owner_only、所属していなければ存在の有無を区別せず 404）。作ったオーナーはそのチャンネルの参加者になる。
        名前は 1〜50 文字（コードポイント）で、空白だけは不可。同じワークスペースに同じ名前があれば 409 channel_name_taken
        （ワークスペースをまたげば同じ名前を使える。機能一覧 3.1。#290）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: 作ったチャンネル（joined は true）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: オーナーでない（owner_only）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: 同じワークスペースに同じ名前のチャンネルがある（channel_name_taken）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/managed-channels:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listManagedChannels
      summary: オーナーの管理用のチャンネル一覧（F-09）
      description: >-
        オーナーだけ（メンバーは 403 owner_only、所属していなければ存在の有無を区別せず 404）。参加していないプライベートチャンネルと
        アーカイブ済みも含める。返すのは id・名前・種別・参加者数（退会済みを含まない）・アーカイブ済みかだけで、
        メッセージ・添付ファイル・未読数・在席は返さない。名前の順（機能一覧 3.1 の但し書き）
      responses:
        '200':
          description: そのワークスペースの全チャンネル
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: オーナーでない（owner_only）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listChannelMembers
      summary: チャンネルの参加者一覧（F-10）
      description: >-
        参加者とオーナーが取得できる。コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加者でもオーナーでもなければ、
        パブリックは 403 not_a_channel_member・プライベートは 404（機能一覧 3.1）。別のワークスペースのチャンネル・無いチャンネルは 404。
        参加した順。退会済みの利用者と在席を含まない（機能一覧 3.1・1.5）
      responses:
        '200':
          description: 参加者
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: inviteChannelMember
      summary: プライベートチャンネルへの招待（F-08）
      description: >-
        そのチャンネルの参加者なら誰でも招待でき、招待した時点で参加する（承諾の流れを持たない。決定・2026-09-12・依頼側。#335）。
        宛先は User.id で、そのワークスペースのメンバー（退会済みを除く）に限る（そうでなければ 422 invitee_not_found。機能一覧 2.2）。
        要求する側のコードは参加者一覧と同じ2段階（所属していなければ 404。所属していて参加していなければ、パブリックは 403 not_a_channel_member・
        プライベートは 404。オーナーでも参加していなければ同じ）。パブリックチャンネルへは招待しない（自由に参加できるため。422 channel_not_private）。
        アーカイブ済みは 409 channel_archived、宛先が既に参加していれば 409 already_channel_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteChannelMemberRequest'
      responses:
        '204':
          description: 参加させた
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済み（channel_archived）か、宛先が既に参加している（already_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            宛先がそのワークスペースのメンバーでない・退会済み（invitee_not_found）か、パブリックチャンネルである（channel_not_private）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/members/{memberId}:
