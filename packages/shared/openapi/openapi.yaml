  /workspaces/{id}/channels/{channelId}/messages:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listMessages
      summary: チャンネルのメッセージの一覧（F-11・F-12）
      description: >-
        新しい順。before（メッセージの id）を渡すと、それより古いものを返す（カーソルページネーション。OFFSET を使わない。機能一覧 4.1）。
        before はそのチャンネルのメッセージでなくてもよく、存在を確かめない（id の順で比べる境目にすぎない）。
        続きがあれば nextBefore に次の before を、無ければ null を返す。
        参加者だけが取得できる。コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加していなければ、
        パブリックは 403 not_a_channel_member・プライベートは 404。オーナーでも参加していなければ同じ（オーナーの例外はメッセージに及ばない。機能一覧 3.1・4.1）。
        別のワークスペースのチャンネル・無いチャンネルは 404。アーカイブ済みでも参加者は読める（機能一覧 3.2）。
        退会した投稿者のメッセージは残し、author を null にする（機能一覧 1.5）
      parameters:
        - name: before
          in: query
          required: false
          description: これより古いメッセージを返す（メッセージの id）。形が uuid でなければ 400
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 返す件数の上限。1〜100、既定は 50（実装時に決めた値。機能一覧 4.1）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: メッセージ（新しい順）と、続きを取るための before
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: postMessage
      summary: チャンネルへのメッセージの投稿（F-11）
      description: >-
        参加者だけが投稿できる。コードは一覧と同じ2段階（所属していなければ 404。所属していて参加していなければ、パブリックは 403 not_a_channel_member・
        プライベートは 404。オーナーでも参加していなければ同じ）。アーカイブ済みのチャンネルには投稿できない（409 channel_archived。機能一覧 3.2）。
        本文は 1〜4000 文字（コードポイント）で、空白だけは不可（機能一覧 4.1）。
        作ったメッセージを message:new としてチャンネルの部屋へ配る（機能一覧 5.2）。
        利用者単位で1分に60回まで（実装時に決めた値。機能一覧 4.1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '201':
          description: 作ったメッセージ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations:
    get:
      operationId: listMyInvitations
      summary: 自分宛ての未承諾の招待の一覧（F-38）
      description: 届いた順
      responses:
        '200':
          description: 自分宛ての未承諾の招待
          content:
            application/json:
              schema:
                type: array
