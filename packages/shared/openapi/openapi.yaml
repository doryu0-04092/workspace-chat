# REST API の仕様。これが唯一の正であり、型はここから生成する（要件定義書 4.7）。
# 変更したら `npm run generate:api` で packages/shared/src/api.gen.ts を作り直す。
# 作り直さずに push すると、CI（code）の「REST の型が仕様と一致することの確認」が落ちる。
openapi: 3.1.0
info:
  title: workspace-chat API
  version: 0.0.0
  description: >-
    エラーの応答の本体はすべて ErrorResponse である。仕様に無いパス（前置き /api の外を含む）は
    404（not_found）を返し、パスごとには載せない。
servers:
  # 全ルートの前置きは /api（#77 の決定。apps/api/src/app-setup.ts の createApp が付ける）。
  - url: /api
# 既定ですべての操作にアクセストークンを求める。認証を要さない操作だけが `security: []` で外す
# （api 側は auth/access-token.guard.ts が同じ既定を持つ。一致は auth/access-token.test.ts が仕様を読んで確かめる）。
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 死活確認（F-39）
      description: 認証を要さない。DB・Redis 等に問い合わせない（機能一覧 14.1）。
      security: []
      responses:
        '200':
          description: 稼働している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      operationId: register
      summary: 新規登録（F-01 / F-03 / F-37）
      description: >-
        認証を要さない。登録と同時にログイン状態にはしない（トークンは返さない）。
        リカバリーコードはこの応答でだけ返し、以後は再表示できない（機能一覧 1.1）。
        発信元単位のレート制限は1時間に10回（機能一覧 1.1）。201・403・409 の要求も1回として数え、
        入力の検証で落ちた要求（400）は数えない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 新規登録を停止している（registration_disabled。要件定義書 5.1）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            ユーザーID が既に使われている（user_id_taken。大文字小文字だけの違いも同じ ID と見なす）。
            代償: どのユーザーID が登録済みかがこの応答で分かり、列挙に使える（ログインは区別しない。機能一覧 1.2）。
            利用者が別の ID を選び直せることを優先した。列挙は発信元単位のレート制限（429）で抑える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: login
      summary: ログイン（F-02）
      description: >-
        認証を要さない。成功するとアクセストークン（JWT・15分）を本体で返し、リフレッシュトークン（14日）を
        Cookie（refresh_token。HttpOnly; Secure; SameSite=Strict; Path=/api/auth）で渡す（機能一覧 1.2）。
        発信元単位のレート制限は15分に20回。加えてユーザーID（大文字小文字を区別しない。存在しない ID も同じ）ごとに、
        連続して失敗した回数 n に対し 2^(n-1) 秒（上限 900 秒）の間は照合せずに 429 を返す。成功で数え直す（リカバリーコードによる再設定の成功でも数え直す。#280）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              description: リフレッシュトークン（refresh_token）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            ユーザーID かパスワードが違う、または退会済み（invalid_credentials）。どれに当たったかは区別しない（機能一覧 1.2）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: アクセストークンの更新（F-02）
      description: >-
        新しいアクセストークンを返す。Cookie（refresh_token）のリフレッシュトークンは、発行から1日を過ぎていれば新しいものに入れ替える
        （1日以内は入れ替えず、Set-Cookie を返さない。機能一覧 1.2）。
        入れ替え済みのトークンが出されたら、そのログインの系列のトークンをすべて失効させる（RFC 9700 4.14.2）。
        本体は送らない。X-Requested-By が無い要求は 400、Sec-Fetch-Site / Origin / Referer が同じ origin を示さない要求は 403
        （要件定義書 4.3 の CSRF の対処）。発信元単位のレート制限は15分に60回（機能一覧 1.2）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedBy'
      responses:
        '200':
          description: 新しいアクセストークン
          headers:
            Set-Cookie:
              description: 入れ替えたときだけ、新しいリフレッシュトークン（refresh_token）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            リフレッシュトークンが無い・知らない・失効済み・期限切れ、または利用者が退会済み（invalid_token）。
            どれに当たったかは区別しない。Cookie を消す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logout
      summary: ログアウト（F-02）
      description: >-
        Cookie（refresh_token）のリフレッシュトークンの系列をすべて失効させ、Cookie を消す（機能一覧 1.2）。
        トークンが無い・知らない場合も 204 を返す。本体は送らない。CSRF の対処は /auth/refresh と同じ。
        発信元単位のレート制限は15分に60回（機能一覧 1.2）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedBy'
      responses:
        '204':
          description: ログアウトした（Cookie を消す）
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/recovery:
    post:
      operationId: recover
      summary: リカバリーコードによるパスワードの再設定（F-37）
      description: >-
        認証を要さない。ユーザーID とリカバリーコードでパスワードを再設定し、使ったコードを無効化して新しいコードを発行する
        （新しいコードはこの応答でだけ返す）。その利用者のリフレッシュトークンをすべて失効させる（機能一覧 1.1）。
        発信元単位のレート制限は1時間に10回。加えてユーザーID（大文字小文字を区別しない。存在しない ID も同じ）ごとに、
        連続して失敗した回数 n に対し 2^(n-1) 秒（上限 900 秒）の間は照合せずに 429 を返す（ログインとは別に数える。ただし再設定に成功したら、ログインの回数も数え直す。#280）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: 再設定した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            ユーザーID かリカバリーコードが違う、コードが使用済み、または退会済み（invalid_credentials）。どれに当たったかは区別しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      operationId: getMyProfile
      summary: 自分のプロフィールの取得（F-04）
      description: >-
        avatarUrl は、アバター画像のアップロードの確定でサーバーが組み立てた配信 URL のパス（/avatars/{User.id}/{uploadId}/{保存名}）か、
        設定していなければ null（機能一覧 1.3。/users/me/avatar/uploads）。
      responses:
        '200':
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateMyProfile
      summary: 自分のプロフィールの編集（F-04）
      description: >-
        送った項目だけを変える。ユーザーID は変えられない（本体に userId を含めると 400。機能一覧 1.3）。
        ステータスは絵文字とテキストの1セットで、null を送ると消える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 変えた後のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/settings:
    get:
      operationId: getMySettings
      summary: 自分の設定の取得（F-23）
      description: >-
        利用者ごとの設定を返す（機能一覧 10.1）。**プロフィールとは別の経路である**——
        プロフィールが持つのは他人に見える情報であり、設定は本人にしか返さない
      responses:
        '200':
          description: 自分の設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateMySettings
      summary: 自分の設定の編集（F-23）
      description: >-
        送った項目だけを変える（機能一覧 10.1）。**既読位置は動かさない**——
        「含めない」→「含める」に戻すと、過去の未読の返信が未読として現れる（一括で既読扱いにしない）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: 変えた後の設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/notifications:
    get:
      operationId: listMyNotifications
      summary: 自分の通知の一覧（F-26）
      description: >-
        受け取ったメンションの通知を、新しい順に返す（機能一覧 10.3）。接続していない間に受けたものも残る。
        before（通知の id）を渡すと、それより古いものを返す（カーソルページネーション）。続きがあれば nextBefore に次の before を、無ければ null を返す。
        **本人の通知だけを返し、いまそのチャンネルの参加者である通知だけを返す**——抜けた・外されたチャンネルと、
        ワークスペースから外れた後のそのワークスペースの通知は出さない（CLAUDE.md 2）。削除済みのメッセージの通知も出さない。
        書き手本人には通知を作らない。編集で本文からメンションを外すと通知は消え、編集で足すと通知が作られる
      parameters:
        - name: before
          in: query
          required: false
          description: これより古い通知を返す（通知の id）。形が uuid でなければ 400
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 返す件数の上限。1〜100、既定は 50（実装時に決めた値。メッセージの一覧と揃える）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 通知（新しい順）と、続きを取るための before
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    put:
      operationId: markNotificationRead
      summary: 通知の既読化（F-26）
      description: >-
        通知を既読にする（機能一覧 10.3）。既に既読なら、最初に既読にした時刻を変えずに 204 を返す。
        **他の利用者の通知・いまそのチャンネルの参加者でない通知・削除済みのメッセージの通知・存在しない通知は、区別せず 404**（存在を認めない。CLAUDE.md 2）
      responses:
        '204':
          description: 既読にした（既に既読だった場合も 204）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /users/me/delete:
    post:
      operationId: deleteMyAccount
      summary: 自分のアカウントの削除（退会。F-36）
      description: >-
        本人だけ（アクセストークンの利用者を削除する。他人を指す手段を持たない）。パスワードの再入力で本人であることを確かめる。
        パスワードが違えば 403 password_mismatch、ワークスペースのオーナーなら 403 owner_cannot_delete_account（理由のメッセージを返す）。
        論理削除であり、同一トランザクションで未使用のリカバリーコードを使用済みにし、所属（Membership。チャンネル参加は連鎖して消える）を消し、
        リフレッシュトークンをすべて失効させる。その利用者の WebSocket 接続を切り、refresh_token の Cookie を消す（機能一覧 1.5）。
        ユーザーID ごとに、パスワードを連続して誤った回数 n に対し 2^(n-1) 秒（上限 900 秒）の間は照合せずに 429 を返す（ログインとは別に数える）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: 削除した（Cookie を消す）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パスワードが違う（password_mismatch）か、ワークスペースのオーナーである（owner_cannot_delete_account）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/avatar/uploads:
    post:
      operationId: createAvatarUpload
      summary: アバター画像のアップロード用の署名付き URL の発行（F-04）
      description: >-
        自分のアバター画像を上げる署名付き URL を発行する（機能一覧 1.3・11.1）。ブラウザは uploadUrl へ uploadHeaders を付けて本体を PUT し、
        終わったら complete で確定する。URL の宛先は隔離用のキー quarantine/avatars/{User.id}/{uploadId}/{保存名} であり、
        キーはすべてサーバーが組み立てる（保存名はファイル名の英数字・.・_・- 以外と先頭の . を _ に置き換え、キー全体が 1,024 バイトに収まるよう切り詰めたもの）。
        有効期限は 5 分で、Content-Type と If-None-Match: * を署名に含む（同じ URL での上書きは 412 で断られる）。
        申告した Content-Type が画像（jpeg / png / gif / webp）でなければ 422 unsupported_file_type、大きさが 10 MB を超えれば 422 file_too_large。
        申告は信用せず、確定で中身から検証する。利用者単位で 10 分に 30 回まで
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: 発行したアップロード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 受け付けない形式（unsupported_file_type）か、上限を超える大きさ（file_too_large）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/avatar/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: completeAvatarUpload
      summary: アバター画像のアップロードの確定（F-04）
      description: >-
        隔離用のキーに PUT した本体を中身から検証し、検証した版に固定して配信用のキー avatars/{User.id}/{uploadId}/{保存名} へコピーし、
        隔離用のキーを削除して、avatarUrl を /avatars/{User.id}/{uploadId}/{保存名} にする（保存名の拡張子は検証した形式のものに付け替える。機能一覧 1.3・11.1）。
        検証に通らなければ配信用のキーへ移さず隔離用のキーを削除し、422 を返す——画像でない・中身が形式に合わない（unsupported_file_type）、
        10 MB を超える（file_too_large）、本体が PUT されていない（upload_not_received）。
        確定は識別子ごとに1回だけ行い、2回目以降はコピーも削除もやり直さず、1回目と同じ状態コードを返す（成功なら、その時点のプロフィール）。
        確定の途中にもう1つ確定を求めると 409 upload_in_progress。
        本人に払い出されていない識別子は 404（識別子の存在を認めない）。利用者単位で 10 分に 30 回まで
      responses:
        '200':
          description: 確定した後のプロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
