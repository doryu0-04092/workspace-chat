# REST API の仕様。これが唯一の正であり、型はここから生成する（要件定義書 4.7）。
# 変更したら `npm run generate:api` で packages/shared/src/api.gen.ts を作り直す。
# 作り直さずに push すると、CI（code）の「REST の型が仕様と一致することの確認」が落ちる。
openapi: 3.1.0
info:
  title: workspace-chat API
  version: 0.0.0
  description: >-
    エラーの応答の本体はすべて ErrorResponse である。仕様に無いパス（前置き /api の外を含む）は
    404（not_found）を返し、パスごとには載せない。
servers:
  # 全ルートの前置きは /api（#77 の決定。apps/api/src/app-setup.ts の createApp が付ける）。
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: 死活確認（F-39）
      description: 認証を要さない。DB・Redis 等に問い合わせない（機能一覧 14.1）。
      security: []
      responses:
        '200':
          description: 稼働している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      operationId: register
      summary: 新規登録（F-01 / F-03 / F-37）
      description: >-
        認証を要さない。登録と同時にログイン状態にはしない（トークンは返さない）。
        リカバリーコードはこの応答でだけ返し、以後は再表示できない（機能一覧 1.1）。
        発信元単位のレート制限は1時間に10回（機能一覧 1.1）。201・403・409 の要求も1回として数え、
        入力の検証で落ちた要求（400）は数えない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 新規登録を停止している（registration_disabled。要件定義書 5.1）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            ユーザーID が既に使われている（user_id_taken。大文字小文字だけの違いも同じ ID と見なす）。
            代償: どのユーザーID が登録済みかがこの応答で分かり、列挙に使える（ログインは区別しない。機能一覧 1.2）。
            利用者が別の ID を選び直せることを優先した。列挙は発信元単位のレート制限（429）で抑える
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  # 複数のパスに共通のエラーの応答。パスに固有の意味を持つもの（403・409 など）はパスに書く。
  responses:
    BadRequest:
      description: >-
        入力が仕様に合わない（validation_failed）か、本体を JSON として読めない（invalid_body）。
        どちらも送られた値を応答に載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 仕様に無いメソッド（method_not_allowed）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 本体が大きすぎる（payload_too_large。上限は Nest の JSON の読み取りの既定の 100kb）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 仕様に無いメディア型の本体（unsupported_media_type）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: レート制限を超えた（too_many_requests。上限はパスの説明に書く）
      headers:
        Retry-After:
          description: 再び受け付けるまでの秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 想定外の失敗（internal_error）。例外のメッセージは載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          description: >-
            エラーの種類。api が返す値はこの列挙だけであり、api と web は生成した型で同じ列挙を使う
            （綴りを誤ると型検査で落ちる）
          type: string
          enum:
            - validation_failed
            - invalid_body
            - not_found
            - method_not_allowed
            - payload_too_large
            - unsupported_media_type
            - too_many_requests
            - user_id_taken
            - registration_disabled
            - request_rejected
            - internal_error
        message:
          type: string
        errors:
          description: 入力の検証で落ちた箇所。送られた値は含めない
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - password
        - displayName
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（機能一覧 1.1）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        password:
          description: >-
            8〜128文字（機能一覧 1.1。上限は決定・2026-09-11・依頼側）。文字数はコードポイントで数える
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          description: 1〜50文字。空白だけは不可（機能一覧 1.1。決定・2026-09-11・依頼側。列の型にも入れてある）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - recoveryCode
      properties:
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - userId
            - displayName
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
            displayName:
              type: string
        recoveryCode:
          description: Crockford の Base32 で16文字（80ビット）を4文字ずつハイフンで区切る
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
