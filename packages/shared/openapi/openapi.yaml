  /workspaces/{id}/channels/{channelId}/mention-candidates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listMentionCandidates
      summary: メンションの補完候補（F-20）
      description: >-
        入力欄の `@` に続く文字列（prefix）で前方一致する、そのチャンネルの参加者で退会していない利用者を、ユーザーID の小文字の昇順に最大10人返す
        （機能一覧 9.1。候補は投稿時の宛先解決で解決できる利用者と一致させ、照合は大文字小文字によらない）。
        コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加者でなければ、パブリックは 403 not_a_channel_member・プライベートは 404。
        オーナーの例外は及ばない（参加していないオーナーも同じ）。別のワークスペースのチャンネル・無いチャンネルは 404
      parameters:
        - name: prefix
          in: query
          required: false
          description: >-
            `@` に続けて入力した文字列。英数字とアンダースコアの 0〜30 文字で、それ以外の形なら 400。省略・空なら参加者の全員が照合に当たる
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{0,30}$'
            default: ''
      responses:
        '200':
          description: 候補（ユーザーID の小文字の昇順。最大10人。実装時に決めた値。機能一覧 9.1）
