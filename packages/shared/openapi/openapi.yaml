        アーカイブの時点で名前に番号を付ける（基底名ごとに、その名前がまだ空いている最小の番号。general → general-1）。
        既に番号を持つチャンネル（復元したもの）は、採番も改名もしない。アーカイブ済みなら 409 channel_archived。
        アーカイブすると一般の一覧から外れる（機能一覧 3.2）
