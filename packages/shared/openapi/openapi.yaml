  /workspaces/{id}/search:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: search
      summary: 検索（F-30・F-31）
      description: >-
        1回の要求で、種別ごとのセクション（メッセージ・チャンネル・ユーザー）を返す（機能一覧 12.1）。
        q は空白で区切った語と、絞り込み演算子 `from:@ユーザーID`・`in:#チャンネル名` からなる。語はすべてを含むものに当たる（大文字小文字を区別する。
        チャンネルとユーザーは区別しない）。演算子はメッセージだけを絞り、同じ演算子を2回書いたら後のものを使う。
        メッセージは、要求した利用者が参加しているチャンネルの、削除されていないもの（返信を含む。アーカイブ済みのチャンネルのものを含む）だけを、新しい順に最大20件返す。
        オーナーの例外は及ばない（参加していないプライベートチャンネルのメッセージは返さない。機能一覧 3.1）。
        `from:` は退会した利用者も指せる（過去のメッセージは残る。機能一覧 1.5）。
        チャンネルは、パブリックでアーカイブされていないものと、参加しているもの（アーカイブ済みを含む）を名前の順に最大20件。
        ユーザーは、そのワークスペースのメンバーで退会していない利用者を、ユーザーID か表示名で当て、ユーザーID の小文字の順に最大20人。
        所属していなければ、存在の有無を区別せず 404。`in:` のチャンネルはコードが2段階で決まる: 無いチャンネル・参加していないプライベートは 404、
        参加していないパブリックは 403 not_a_channel_member。利用者単位で1分に60回まで
      parameters:
        - name: q
          in: query
          required: true
          description: 検索の文字列。1〜200 文字（コードポイント）で、空白だけは不可
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '\S'
      responses:
        '200':
          description: 種別ごとの結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`in:` のパブリックチャンネルに参加していない（not_a_channel_member）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/mention-candidates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listMentionCandidates
      summary: メンションの補完候補（F-20）
      description: >-
        入力欄の `@` に続く文字列（prefix）で前方一致する、そのチャンネルの参加者で退会していない利用者を、ユーザーID の小文字の昇順に最大10人返す
        （機能一覧 9.1。候補は投稿時の宛先解決で解決できる利用者と一致させ、照合は大文字小文字によらない）。
        コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加者でなければ、パブリックは 403 not_a_channel_member・プライベートは 404。
        オーナーの例外は及ばない（参加していないオーナーも同じ）。別のワークスペースのチャンネル・無いチャンネルは 404
      parameters:
        - name: prefix
          in: query
          required: false
          description: >-
            `@` に続けて入力した文字列。英数字とアンダースコアの 0〜30 文字で、それ以外の形なら 400。省略・空なら参加者の全員が照合に当たる
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{0,30}$'
            default: ''
      responses:
        '200':
          description: 候補（ユーザーID の小文字の昇順。最大10人。実装時に決めた値。機能一覧 9.1）
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
