      description: >-
        新しい順。before（メッセージの id）を渡すと、それより古いものを返す（カーソルページネーション。OFFSET を使わない。機能一覧 4.1）。
        スレッドの返信は含めない（返信の一覧は replies。機能一覧 6）。
        before はそのチャンネルのメッセージでなくてもよく、存在を確かめない（id の順で比べる境目にすぎない）。
        続きがあれば nextBefore に次の before を、無ければ null を返す。
        参加者だけが取得できる。コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加していなければ、
        パブリックは 403 not_a_channel_member・プライベートは 404。オーナーでも参加していなければ同じ（オーナーの例外はメッセージに及ばない。機能一覧 3.1・4.1）。
        別のワークスペースのチャンネル・無いチャンネルは 404。アーカイブ済みでも参加者は読める（機能一覧 3.2）。
        退会した投稿者のメッセージは残し、author を null にする（機能一覧 1.5）
      parameters:
        - name: before
          in: query
          required: false
          description: これより古いメッセージを返す（メッセージの id）。形が uuid でなければ 400
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 返す件数の上限。1〜100、既定は 50（実装時に決めた値。機能一覧 4.1）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: メッセージ（新しい順）と、続きを取るための before
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: postMessage
      summary: チャンネルへのメッセージの投稿（F-11）
      description: >-
        参加者だけが投稿できる。コードは一覧と同じ2段階（所属していなければ 404。所属していて参加していなければ、パブリックは 403 not_a_channel_member・
        プライベートは 404。オーナーでも参加していなければ同じ）。アーカイブ済みのチャンネルには投稿できない（409 channel_archived。機能一覧 3.2）。
        本文は 1〜4000 文字（コードポイント）で、空白だけは不可（機能一覧 4.1）。
        作ったメッセージを message:new としてチャンネルの部屋へ配る。本文のメンションの対象がいれば、その利用者の部屋も加えて1回で配る（機能一覧 5.2・9.1）。
        投稿・返信・編集・削除を合わせて、利用者単位で1分に60回まで（4つのルートで1つの枠。機能一覧 4.1・4.2・6）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '201':
          description: 作ったメッセージ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
    patch:
      operationId: editMessage
      summary: メッセージの編集（F-13）
      description: >-
        自分のメッセージだけを編集できる（作者でなければ 403 not_message_author。オーナーでも同じ。機能一覧 4.2）。
        判定の順: 所属していなければ 404 → 参加していなければパブリックは 403 not_a_channel_member・プライベートは 404 →
        そのチャンネルに無い・削除済みのメッセージは 404 → 作者でなければ 403 not_message_author → アーカイブ済みのチャンネルは 409 channel_archived。
        本文の形は投稿と同じ（1〜4000 文字・空白だけは不可）。編集したメッセージを message:updated としてチャンネルの部屋へ配る（機能一覧 5.2）。
        投稿・返信・編集・削除を合わせて、利用者単位で1分に60回まで（4つのルートで1つの枠。機能一覧 4.1・4.2・6）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '200':
          description: 編集したメッセージ（editedAt を持つ）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）か、自分のメッセージではない（not_message_author）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteMessage
      summary: メッセージの削除（F-13）
      description: >-
        論理削除（機能一覧 4.2）。自分のメッセージだけを削除できる。判定の順は編集と同じ。本文は DB に残るが、
        以後の応答と配信では返さない（body: null・deleted: true。要件定義書 3.4）。message:deleted（本文を載せない）をチャンネルの部屋へ配る。
        返信を削除したら、親の返信件数（replyCount）を同じトランザクションで1つ減らし、親を message:updated として配る。
        親を削除しても返信は残す（機能一覧 4.2・6）。
        投稿・返信・編集・削除を合わせて、利用者単位で1分に60回まで（4つのルートで1つの枠。機能一覧 4.1・4.2・6）
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）か、自分のメッセージではない（not_message_author）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/messages/{messageId}/replies:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
    get:
      operationId: listReplies
      summary: スレッドの返信の一覧（F-17）
      description: >-
        親（messageId）の返信を新しい順に返す。before・limit・nextBefore の扱いはチャンネルの一覧と同じ（機能一覧 4.1・6）。
        コードは2段階で決まる: 所属していなければ種別によらず 404。所属していて参加していなければ、パブリックは 403 not_a_channel_member・
        プライベートは 404。オーナーでも参加していなければ同じ（オーナーの例外はメッセージに及ばない。機能一覧 3.1・4.1）。
        そのチャンネルに無いメッセージと、返信（返信はスレッドを持たない。1階層のみ）は 404。
        削除済みの親の返信も読める（返信は保持する。機能一覧 4.2）。アーカイブ済みでも参加者は読める（機能一覧 3.2）
      parameters:
        - name: before
          in: query
          required: false
          description: これより古い返信を返す（メッセージの id）。形が uuid でなければ 400
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 返す件数の上限。1〜100、既定は 50（チャンネルの一覧と同じ。機能一覧 4.1）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 返信（新しい順）と、続きを取るための before
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: パブリックチャンネルに参加していない（not_a_channel_member）
          content:
