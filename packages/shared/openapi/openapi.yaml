          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: アーカイブ済みのチャンネル（channel_archived）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /avatars/cookies:
    post:
      operationId: issueAvatarCookies
      summary: アバターの配信の署名付き Cookie の発行（F-04）
      description: >-
        ログインしている利用者に、CloudFront の /avatars/* に有効な署名付き Cookie を発行する（機能一覧 1.3。ワークスペースやチャンネルの参加を問わない）。
        Cookie は CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id の3つで、Path=/avatars; HttpOnly; Secure; SameSite=Strict。
        期限（expiresIn 秒）より前に取り直す。CloudFront の署名鍵を設定していない環境（手元）では Cookie を発行せず 204 を返す。
        本体は送らない
      responses:
        '200':
          description: 発行した
          headers:
            Set-Cookie:
              description: CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id（Path=/avatars）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedCookiesResponse'
        '204':
          description: CloudFront の署名鍵を設定していない環境であり、Cookie を発行しない
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspaces/{id}/channels/{channelId}/files/cookies:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: issueChannelFileCookies
      summary: チャンネルの添付の配信の署名付き Cookie の発行（F-29）
      description: >-
        そのチャンネルの参加者に、CloudFront の /files/workspace/{ws}/channel/{ch}/* に限って有効な署名付き Cookie を発行する（機能一覧 11.2）。
        Cookie は CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id の3つで、Path=/files; HttpOnly; Secure; SameSite=Strict。
        同じ名前・Path の Cookie は上書きされるため、有効なのは最後に発行したチャンネルの分だけである。期限（expiresIn 秒）より前に取り直す。
        コードは参加者一覧と同じ2段階: 所属していなければ種別によらず 404、所属していて参加者でなければパブリックは 403
        not_a_channel_member・プライベートは 404。オーナーの例外は及ばない。アーカイブ済みのチャンネルも、参加者には発行する（読める。機能一覧 3.2）。
        CloudFront の署名鍵を設定していない環境（手元）では、判定を通ったときに Cookie を発行せず 204 を返す。本体は送らない
      responses:
        '200':
          description: 発行した
          headers:
            Set-Cookie:
              description: CloudFront-Policy・CloudFront-Signature・CloudFront-Key-Pair-Id（Path=/files）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedCookiesResponse'
        '204':
          description: CloudFront の署名鍵を設定していない環境であり、Cookie を発行しない
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: そのチャンネルの参加者でない（not_a_channel_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations:
    get:
      operationId: listMyInvitations
      summary: 自分宛ての未承諾の招待の一覧（F-38）
      description: 届いた順
      responses:
        '200':
          description: 自分宛ての未承諾の招待
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptInvitation
      summary: 招待の承諾（F-38）
      description: >-
        参加（MEMBER）が成立し、招待は消える。自分宛てでない招待・無い招待は、存在の有無を区別せず 404。
        既にメンバーなら 409 already_member
      responses:
        '200':
          description: 参加したワークスペース（role は MEMBER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >-
            既にメンバーである（already_member）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invitations/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: declineInvitation
      summary: 招待の辞退（F-38）
      description: >-
        招待が消える（オーナーは再度招待できる）。自分宛てでない招待・無い招待は、存在の有無を区別せず 404
      responses:
        '204':
          description: 辞退した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      description: ログイン（/auth/login）とリフレッシュ（/auth/refresh）が返すアクセストークン（JWT・HS256）
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: 外す利用者の User.id（ユーザーID ではない）。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      description: チャンネルの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      description: メッセージの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      description: 招待の id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: id
      in: path
      required: true
      description: ワークスペースの id。形が uuid でなければ 400
      schema:
        type: string
        format: uuid
    RequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: >-
        Cookie を使う要求であることを示す独自のヘッダー。ブラウザは独自のヘッダーを付けた別の origin からの要求に
        プリフライトを求めるため、フォームや画像の読み込みからは送れない（要件定義書 4.3）
      schema:
        type: string
        enum:
          - workspace-chat
  # 複数のパスに共通のエラーの応答。パスに固有の意味を持つもの（403・409 など）はパスに書く。
  responses:
    Unauthorized:
      description: >-
        Authorization ヘッダーが無い、または Bearer 方式でない（authentication_required）か、
        Bearer 方式で資格情報が無い・壊れている・期限切れ・利用者が退会済み（invalid_token。どれに当たったかは区別しない。機能一覧 1.4）。
        アクセストークンはリフレッシュ（/auth/refresh）で取り直す。仕様の形の検証（400）はトークンの確認より先に行う（仕様で書けない検証は後に行う）
      headers:
        WWW-Authenticate:
          description: >-
            Authorization ヘッダーが無い・Bearer 方式でないときは `Bearer`、Bearer 方式で資格情報が無い・使えないときは `Bearer error="invalid_token"`（RFC 6750 3.1）
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfRejected:
      description: >-
        Sec-Fetch-Site・Origin・Referer のどれも、api と同じ origin からの要求であることを示さない（csrf_rejected）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: >-
        入力が仕様に合わない（validation_failed）か、本体を JSON として読めない（invalid_body）。
        どちらも送られた値を応答に載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 仕様に無いメソッド（method_not_allowed）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 本体が大きすぎる（payload_too_large。上限は Nest の JSON の読み取りの既定の 100kb）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 仕様に無いメディア型の本体（unsupported_media_type）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: レート制限を超えた（too_many_requests。上限はパスの説明に書く）
      headers:
        Retry-After:
          description: 再び受け付けるまでの秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        見つからない（not_found）。所属していないワークスペースは、存在の有無を区別せずこれになる（機能一覧 2.1・1.4）。
        本体は状態コードの本体であり、権限の有無を述べない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 想定外の失敗（internal_error）。例外のメッセージは載せない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          description: >-
            エラーの種類。api が返す値はこの列挙だけであり、api と web は生成した型で同じ列挙を使う
            （綴りを誤ると型検査で落ちる）
          type: string
          enum:
            - validation_failed
            - invalid_body
            - not_found
            - method_not_allowed
            - payload_too_large
            - unsupported_media_type
            - too_many_requests
            - user_id_taken
            - registration_disabled
            - invalid_credentials
            - authentication_required
            - invalid_token
            - csrf_rejected
            - owner_only
            - invitee_not_found
            - already_invited
            - already_member
            - owner_cannot_leave
            - channel_name_taken
            - not_a_channel_member
            - already_channel_member
            - channel_archived
            - channel_not_private
            - channel_not_archived
            - not_message_author
            - request_rejected
            - internal_error
        message:
          type: string
        errors:
          description: 入力の検証で落ちた箇所。送られた値は含めない
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - password
        - displayName
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（機能一覧 1.1）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        password:
          description: >-
            8〜128文字（機能一覧 1.1。上限は決定・2026-09-11・依頼側）。文字数はコードポイントで数える
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          description: 1〜50文字。空白だけは不可（機能一覧 1.1。決定・2026-09-11・依頼側。列の型にも入れてある）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - recoveryCode
        - newPassword
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（RegisterRequest と同じ）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        recoveryCode:
          description: >-
            登録で受け取ったコード。英小文字・ハイフンの有無を問わない（照合の前に正規形へ寄せる。O は 0、I・L は 1 と読む）
          type: string
          pattern: '^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$'
        newPassword:
          description: 8〜128文字（RegisterRequest の password と同じ）
          type: string
          minLength: 8
          maxLength: 128
    RecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - recoveryCode
      properties:
        recoveryCode:
          description: 新しいリカバリーコード。Crockford の Base32 で16文字（80ビット）を4文字ずつハイフンで区切る
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - recoveryCode
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        recoveryCode:
          description: Crockford の Base32 で16文字（80ビット）を4文字ずつハイフンで区切る
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - password
      properties:
        userId:
          description: 英数字とアンダースコアのみ、3〜30文字（RegisterRequest と同じ）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
        password:
          description: >-
            1〜128文字。下限を登録（8文字）に揃えないのは、下限を変えたときに既存の利用者がログインできなくならないようにするため
          type: string
          minLength: 1
          maxLength: 128
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          description: JWT（HS256）。Authorization ヘッダーに Bearer で付ける
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: アクセストークンの有効期間（秒）
          type: integer
    SignedCookiesResponse:
      description: 発行した CloudFront の署名付き Cookie の有効期間
      type: object
      additionalProperties: false
      required:
        - expiresIn
      properties:
        expiresIn:
          description: 署名付き Cookie の有効期間（秒）。これより前に取り直す
          type: integer
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          description: JWT（HS256）。Authorization ヘッダーに Bearer で付ける
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: アクセストークンの有効期間（秒）
          type: integer
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
    UserSettings:
      description: >-
        利用者ごとの設定（F-23。機能一覧 10.1）。**プロフィール（Profile）とは分ける**——
        プロフィールが持つのは他人に見える情報であり、設定は本人にしか返さない。
        通知の設定（F-24・F-25）が増えたら、ここに足す
      type: object
      additionalProperties: false
      required:
        - threadUnreadIncluded
      properties:
        threadUnreadIncluded:
          description: >-
            スレッド内の未読を、チャンネルの未読に含めるか（既定は含める）。
            切り替えても既読位置は動かさないため、「含めない」→「含める」で過去の未読の返信が未読として現れる（機能一覧 10.1）
          type: boolean
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        threadUnreadIncluded:
          description: 送った項目だけを変える（機能一覧 10.1）
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - avatarUrl
        - status
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
        status:
          description: 絵文字とテキストの1セット。設定していなければ null（機能一覧 1.3）
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
    Status:
      description: >-
        ステータス（機能一覧 1.3）。絵文字とテキストは1セットであり、片方だけは持たない（決定・2026-09-12・依頼側。#283）
      type: object
      additionalProperties: false
      required:
        - emoji
        - text
      properties:
        emoji:
          description: >-
            絵文字1つ（Unicode の RGI_Emoji に当たる列1つ。肌の色や ZWJ で繋いだ列・国旗も1つと数える）。
            この形は pattern で表せないため、api が確かめて 400（validation_failed）を返す
          type: string
        text:
          description: 1〜100文字（文字数はコードポイントで数える）
          type: string
          minLength: 1
          maxLength: 100
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          description: 1〜50文字。空白だけは不可（RegisterRequest と同じ）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
        status:
          description: 絵文字とテキストの1セットで設定する。null で消す（片方だけの本体は 400）
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: >-
            1〜50 文字（文字数はコードポイントで数える）。空白だけは不可（決定・2026-09-12・依頼側。#290）。
            上限は入力にだけ置く（応答と DB の列には置かない。同決定）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
    WorkspaceRole:
      description: ワークスペースでの役割（schema.prisma の WorkspaceRole）
      type: string
      enum:
        - OWNER
        - MEMBER
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        role:
          description: 要求した利用者の、このワークスペースでの役割
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceMember:
      description: 参加者。UserSummary に役割を足したもの
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - role
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    ChannelVisibility:
      description: チャンネルの種別（schema.prisma の ChannelVisibility）
      type: string
      enum:
        - PUBLIC
        - PRIVATE
    UpdateChannelReadRequest:
      type: object
      additionalProperties: false
      required:
        - lastReadMessageId
      properties:
        lastReadMessageId:
          description: >-
            読んだ位置（そのチャンネルのメッセージの id。F-23。機能一覧 10.1）。
            既読位置は戻さないため、いま持っている位置より古い id を渡しても既読位置は変わらない
          type: string
          format: uuid
    CreateChannelRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - visibility
      properties:
        name:
          description: >-
            1〜50 文字（文字数はコードポイントで数える）。空白だけは不可（決定・2026-09-12・依頼側。#290）。
            上限は入力にだけ置く（アーカイブ時の接尾辞 -<採番> はこの外側に付くため、応答と DB の列には置かない。同決定）
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
    PostMessageRequest:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          description: 1〜4000 文字（文字数はコードポイントで数える）。空白だけは不可（機能一覧 4.1）
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '\S'
    Message:
      description: チャンネルのメッセージ（機能一覧 4.1・4.2）
      type: object
      additionalProperties: false
      required:
        - id
        - channelId
        - author
        - body
        - createdAt
        - editedAt
        - deleted
        - parentId
        - replyCount
        - replyParticipants
        - mentions
      properties:
        id:
          description: UUIDv7。一覧のカーソル（before）にそのまま使う
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        parentId:
          description: スレッドの親の id。チャンネルの本体のメッセージなら null（機能一覧 6）
          type:
            - string
            - 'null'
          format: uuid
        replyCount:
          description: 削除されていない返信の件数。返信なら常に 0（返信はスレッドを持たない。機能一覧 6）
          type: integer
          minimum: 0
        replyParticipants:
          description: >-
            返信した参加者。削除されていない返信を書いた、退会していない利用者を、最後に返信した順に最大3人（機能一覧 6）。
            返信と、返信の無いメッセージは空
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/UserSummary'
        author:
          description: 投稿者。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        body:
          description: 本文。削除済みなら null（本文は DB に残るが返さない。機能一覧 4.2）
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        editedAt:
          description: 最後に編集した時刻。編集していなければ null（「編集済み」の表示に使う。機能一覧 4.2）
          type:
            - string
            - 'null'
          format: date-time
        deleted:
          description: 削除済みか（「このメッセージは削除されました」に置き換えて表示する。機能一覧 4.2）
          type: boolean
        mentions:
          description: >-
            本文のメンションの対象（機能一覧 9.1）。投稿・返信のときに、そのチャンネルの参加者で退会していない利用者へ解決できた
            `@ユーザーID` を保存し、本文に最初に現れた順に1人1件で載せる。編集では、本文にユーザーID が残っている対象は解決し直さずに残す
            （チャンネルを抜けた・退会した対象も残り、退会した対象は user が null）。本文から消えた対象は外し、新しく書いた `@` は投稿と同じく解決して足す。
            削除済みのメッセージは空
          type: array
          items:
            $ref: '#/components/schemas/MessageMention'
    MessageMention:
      description: メンションの対象（表示時の参照先。機能一覧 9.1 の経路2。対象がいまそのチャンネルの参加者かは問わない）
      type: object
      additionalProperties: false
      required:
        - userId
        - user
      properties:
        userId:
          description: 対象のユーザーID（登録したときの大文字小文字のまま）。本文の `@ユーザーID` とは大文字小文字によらず照合する（機能一覧 1.1）
          type: string
        user:
          description: 対象の利用者。退会した利用者なら null（削除済みの利用者として表示する。機能一覧 1.5）
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
    MessagePage:
      type: object
      additionalProperties: false
      required:
        - messages
        - nextBefore
      properties:
        messages:
          description: 新しい順
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextBefore:
          description: 続きを取るときに before に渡す id。続きが無ければ null
          type:
            - string
            - 'null'
          format: uuid
    Channel:
      description: 一般の一覧（参加者向け）のチャンネル
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - joined
        - joinedAt
        - unread
        - mentions
        - lastReadMessageId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
        joined:
          description: 要求した利用者がこのチャンネルに参加しているか
          type: boolean
        joinedAt:
          description: >-
            要求した利用者がこのチャンネルに参加した時刻（F-23。機能一覧 10.1）。参加していなければ null。
            **既読位置をまだ持たない利用者の「ここから未読」の区切り線を、この時刻より後の最初のメッセージの上に出すために要る**——
            未読数から位置を数えてはならないため、境目は時刻か id でしか決められない
          type:
            - string
            - 'null'
          format: date-time
        unread:
          description: >-
            要求した利用者の未読数（F-23。機能一覧 10.1）。既読位置からの差分で求め、自分の投稿と削除済みは数えない。
            既読位置をまだ持たない利用者は、参加した時点より後だけを数える。参加していないパブリックチャンネルは常に 0
          type: integer
          minimum: 0
        mentions:
          description: >-
            要求した利用者のメンションの件数（F-24。機能一覧 10.2）。**未読のうち、要求した利用者をメンションしているもの**を数える
            ——`unread` と同じ条件で数えるため、常に `unread` 以下であり、既読を進めると一緒に減る。
            `@here` / `@channel` は数えない（保存していない）。参加していないチャンネルは常に 0
          type: integer
          minimum: 0
        lastReadMessageId:
          description: >-
            要求した利用者の既読位置（F-23。機能一覧 10.1）。「ここから未読」の区切り線を、この次のメッセージの上に出す。
            まだ既読位置を持たない利用者と、参加していないチャンネルでは null（線は、参加した時点より後の最初のメッセージの上に出す）。
            未読数から位置を数えてはならない——自分の投稿と削除済みは未読に数えないが、一覧には並ぶため必ずずれる
          type:
            - string
            - 'null'
          format: uuid
    ManagedChannel:
      description: >-
        オーナーの管理用の一覧の項目。持つのはこれだけで、メッセージ・添付ファイル・未読数・在席は持たない（機能一覧 3.1 の但し書き）
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - memberCount
        - archived
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/ChannelVisibility'
        memberCount:
          description: 参加者の数。退会済みの利用者を含めない（機能一覧 1.5）
          type: integer
          minimum: 0
        archived:
          description: アーカイブ済みか（管理用の一覧はアーカイブ済みも含める。含めないと復元の経路が無くなる。F-35）
          type: boolean
    InviteChannelMemberRequest:
      type: object
      additionalProperties: false
      required:
        - memberId
      properties:
        memberId:
          description: 招待する利用者の User.id（ワークスペースの参加者一覧が返す id。ユーザーID ではない）
          type: string
          format: uuid
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          description: 招待する利用者のユーザーID（大文字小文字を区別しない。形は登録と同じ英数字と _ の 3〜30 文字）
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
    Invitation:
      description: 作った招待（招待したオーナーに返す）
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - invitee
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        invitee:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
    MyInvitation:
      description: 自分宛ての未承諾の招待
      type: object
      additionalProperties: false
      required:
        - id
        - workspace
        - invitedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        invitedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
