# 依存の更新をどう扱うかの設定。
# 要件定義書 4.3 が「依存の脆弱性を継続的に検査する」と定めている。
#
# ==========================================================================
# 方針（2026-09-04 決定）: npm の版は、動くことを確かめた組み合わせで固定する。
# ==========================================================================
#
# **この方針が却下するのは「新しい版が出たから上げる」だけである。**
# **脆弱性を塞ぐための更新は、この方針の対象ではない。取り込む**
# （README の「依存の版を上げない方針」）。
#
# 版を上げるかどうかは**一度だけ判断し、以後は自動提案を受け取らない**。
# 最初に選んだ版は、互いに噛み合うことを確かめた組み合わせであり、
# **1つだけ動かすと噛み合わなくなる**ためである。
#
# 根拠となった実例（PR #21。開発依存3件の一括提案）:
#   - @types/node 24 -> 26 : ランタイムは Node 24 に固定している。
#                            Node 26 の型を入れると、存在しない API を書いても
#                            型検査が通り、**実行して初めて落ちる**
#   - @vitejs/plugin-react 5 -> 6 : vite@^8 を要求する。Vite 7 では入らない
#   - jsdom 28 -> 30 : ルートに巻き上げられず apps/web 配下に入る。vitest は
#                      ルートから jsdom を探すため、**web のテストが1本まるごと
#                      起動に失敗する**（npm test の終了コード 1 で確認）
#
# **3件すべてが、受け入れてはいけないものだった。** CI は3件とも緑だった。
# 毎週この判断を繰り返しても、判断の質は保てない。
#
# 代償（承知のうえで受け入れる）:
#   - **依存の版は自動では上がらなくなる。** 上げるのは、必要が生じたときの手作業になる
#   - 脆弱性を直す更新も、自動では PR にならない。
#     security updates は版更新とは別の仕組みでこのファイルでは制御できないが、
#     **このリポジトリではアラート自体が無効**であるため、結局は来ない
#     （有効にするかは #36 で判断する）
#   - **moderate 以下は、誰も知らせてくれない。**
#     audit.yml が落とすのは high 以上（scripts/check-audit.mjs の BLOCKING）であり、
#     moderate 以下では失敗しない。
#     かつては「moderate 以下は Dependabot の PR で追う」としていたが、
#     **その経路がこの変更で消えた。** 代わりに audit.yml の「全件表示」ステップの
#     出力を、週次実行のログで人が読む
#   - high 以上の**検知は audit.yml が毎週続ける**（npm audit --json を
#     scripts/check-audit.mjs が判定する）。落ちたら、そのとき直す版を人が選ぶ。
#     **塞げる版が無い場合に限り、期限とイシュー参照を付けて名指しで通す**
#     （README の「依存の版を上げない方針」の表）。「気づけない」状態にはならない
version: 2
updates:
  # npm。open-pull-requests-limit: 0 は、この生態系の版更新 PR を止める指定である。
  # 設定ごと消さないのは、**止めていることを設定として残すため**。
  # ファイルから消すと「設定し忘れ」と区別がつかない。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # GitHub Actions は止めない。
  # npm と違い、こちらのメジャーは**実行環境（Node 20 -> 24）の移行**を含む。
  # 放置すると非推奨のランタイムで動き続け、いずれ動かなくなる。
  # PR #4 のレビューで、実際に checkout が Node 20 のまま取り残されていた。
  # **機械に見張らせる価値が、npm とは別にある。**
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # 個別に来るとレビューの回数が増え、1件あたりに向ける注意が薄くなる。
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore'
# docker は足さない（決定・2026-09-16・依頼側）。
# **設定し忘れではない。** npm の open-pull-requests-limit: 0 と同じで、
# 「検討して採らなかった」ことをここに残す。
#
# 足さない理由: Dockerfile の土台はタグで指しており（apps/api/Dockerfile の NODE_IMAGE、
# docker/postgres/Dockerfile の POSTGRES_IMAGE）、docker のエコシステムが出すのは
# **タグの版を上げる提案**である。版を上げる提案は、上の npm と同じ方針で受け取らない
# （README の「依存の版を上げない方針」）。
#
# **代わりの経路: 同じタグの中の更新は、タグを取り直すことで受け取る。**
# **経路の本数と強さは、タグごとに違う。下の表が正本であり、各ファイルの注記はここを指す。**
#
#   node:24-bookworm-slim（api の土台。apps/api/Dockerfile の NODE_IMAGE）
#     経路: scripts/api-image.test.sh の docker build --pull
#           scripts/release.sh の docker buildx build --pull
#     強さ: **イメージを作るたび。** 片方を外しても、もう片方には届く。
#     **ただし外すと、CI が確かめた土台と、本番に出すイメージの土台が揃わなくなる**（これが外してはならない理由）
#
#   postgres:17-bookworm（db とテストの土台。docker/postgres/Dockerfile の POSTGRES_IMAGE）
#     経路: docker compose build --pull db（README の操作表）
#           scripts/api-image.test.sh の docker build --pull
#           apps/api/src/testing/postgres.ts の docker build --pull（テストの workspace-chat-db:test）
#     強さ: **開発環境の db（workspace-chat-db:local）に届くのは、人が compose build --pull を叩いたときだけ。**
#     テストのイメージは npm test か api-image.test.sh を流せば届くが、別の名前のため開発環境の db には入らない。
#     docker compose up -d --build --wait では取り直されない（README の実測）
#
#   valkey/valkey:8-alpine（compose.yaml の redis と、apps/api/src/testing/valkey.ts の VALKEY_IMAGE。**同じタグ**）
#     経路: docker compose pull redis（README の操作表）
#           valkey.ts の PullPolicy.alwaysPull()
#     強さ: **npm test を流せば届く。** 手元でテストを回さない人には、compose pull だけが経路になる。
#     **どちらも取り直すのは手元のイメージまでで、動いているコンテナに入るのは次に up -d で作り直したとき**
#
#   quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z（compose.yaml の minio）
#     経路: docker compose pull minio
#     **ただし、2026-09-25 から quay.io は認証なしでは取らせない（401。#698）。取り済みのイメージが無い機械では、手元の MinIO が起動しない。**
#     Docker Hub の minio/minio も同日に 401。手元の代わりの S3 であり、本番には入らない
#
#   cgr.dev/chainguard/minio@sha256:…（apps/api/src/testing/minio.ts の MINIO_IMAGE。**compose.yaml とは別のイメージ**）
#     経路: minio.ts の PullPolicy.alwaysPull()
#     **ダイジェストで固定しているため、取り直しても同じ版のままである**（無料で取れるのは latest のタグだけ。#698）。テストの代わりの S3 であり、本番には入らない
#
# **代償**: テストの土台は起動のたびにレジストリへ問い合わせるため npm test が遅くなり、
# レジストリが不調だとテストごと落ちる（#517 の CI で実際に起きた）。各 docblock にも書いてある。
#
# **土台を足すときは、この表に行を足す。** 取り直しの綴りは docker build --pull /
# docker buildx build --pull / docker compose build --pull / docker compose pull / docker pull /
# PullPolicy.alwaysPull() と分かれており、**綴りで数えると漏れる**（#517 の第0〜4巡で5回起きた。機械の検査は #518）。
# **引くときは呼び出しの形で引く**（PullPolicy という型の名前で引くと、依存の一覧表の記述まで当たる）。
#
# **pg_bigm の更新を追う経路は無い**（docker/postgres/Dockerfile が SHA-1 を指定して git fetch で取るため、
# docker のエコシステムでも --pull でも追えない）。無いことをここに記録する。
# **clone してから SHA-1 を照合する形は、その Dockerfile がやめている**（同ファイルの注記。
# それでは「同じ中身をビルドできる」ことを守れないため）。
