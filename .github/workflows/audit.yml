name: audit

# 依存の脆弱性検査。要件定義書 4.3 が「npm audit を CI で継続的に実行する」と定めている。
#
# **この検査が、脆弱性に気づく唯一の経路である。**
# 依存の版は固定し、Dependabot の版更新は受け取らない方針にした（README の
# 「依存の版を上げない方針」）。加えて、このリポジトリでは Dependabot の
# アラート自体が無効である（API で確認。有効なら 204、実際は 404 が返る）。
# **したがって脆弱性を知らせるものは他に無い。**
#
# ci.yml と分けている理由は2つ。
# 1. npm audit は registry の応答に依存する。落ちたときに lint やテストの結果まで
#    巻き添えで読めなくなるのを避ける
# 2. **「継続的に」を満たすには定期実行が要る。** PR と push だけでは、
#    コードが動かない期間に公表された脆弱性を誰も拾わない

on:
  pull_request:
  push:
    branches: [main]
  # 手で起こせるようにしておく。**gitleaks の走査範囲はイベントで変わり、
  # PR と push では差分しか見ない。** 全履歴を見る経路（定期実行）が本当に効いているかを
  # 週を待たずに確かめられないと、「見ているつもり」のまま置かれる。
  workflow_dispatch:
  schedule:
    # 毎週月曜 09:00 JST（UTC 00:00）
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    # 既定は6時間。ぶら下がった実行がランナーの時間を食い尽くすのを避ける。
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # **gitleaks の走査範囲は、起動したイベントで変わる。**
      # PR と push では**その差分のコミットだけ**、定期実行と手動起動では**全履歴**を見る
      # （アクション側が範囲を決めており、全履歴を強制する設定は無い）。
      #
      # **実測（2026-09-08。このワークフローのログ）**:
      #   PR での実行 → `gitleaks detect … --first-parent <sha>^..<sha>` / 1 commits scanned（3.5 KB）
      #   手動起動     → `gitleaks detect`（範囲指定なし）        / 214 commits scanned（1.75 MB）
      # 全履歴の側を成り立たせるために、浅い取得をやめる。
      # **depth 1 のままだと、定期実行でも過去のコミットを1件も見ない。**
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 代償1: --audit-level=high としているため、moderate 以下は止めない。
      # 開発用の推移依存に moderate が出ただけで全員の作業が止まると、
      # 「とりあえず外す」方向に働く。
      #
      # **かつては「moderate 以下は Dependabot の PR で追う」としていたが、
      # その経路は無くなった。** 版更新の PR を止め、アラートも無効であるため、
      # moderate 以下を知らせるものは何も無い。
      #
      # **代わりに、下の全件表示の出力を人が読んで拾う。**
      # このステップは high 未満でも落ちないが、出力には残る。
      # 定期実行のログを読む先を、ここ1箇所に定めておく。
      #
      # 代償2: **修正版が公開されていない high 以上が出ると、全 PR のマージ経路が塞がる。**
      # npm audit には「この1件だけ無視する」指定が無い（npm 11.13.0 の --help で確認）。
      #
      # **塞ぎ方は [README](../../README.md) の「依存の版を上げない方針」の表による。**
      # ここに手を列挙しない——**列挙した分だけが手の全部になり、README 側と食い違う。**
      #
      # **閾値（--audit-level）を下げる形は採らない。**
      # その1件だけでなく、次に来る件も一緒に見逃すためである。
      # **名指しで通すために、--json の出力を自前で判定する。**
      #
      # 判定の中身は scripts/check-audit.mjs にある。**落とす条件は2つある。**
      #   1. 許可していない high 以上が残っている
      #   2. **許可した id が1件も出なくなった**（上流が直った合図。許可を消す）
      # 2 が無いと、許可は消えないまま残り、「通している」ことを忘れる。
      #
      # 通す対象は scripts/audit-allowlist.json（データ）側にある。
      # **仕組みとデータを分けているのは、仕組みを他のリポジトリへ持っていけるようにするためである。**
      #
      # || true は npm audit が「1件でも見つかると非ゼロ」を返すためで、
      # **検査の結果を握り潰しているのではない。** 合否は check-audit.mjs が決める。
      # 出力が JSON として読めなければ、そちらが exit 2 で落ちる
      # （registry の障害を「脆弱性ゼロ」と読み違えない）。
      - name: 依存の脆弱性検査
        run: |
          npm audit --json > audit-report.json || true
          node scripts/check-audit.mjs audit-report.json

      # moderate 以下を人が拾うための出力。**ここは落とさない。**
      # 上のステップが落ちても実行する。落ちたときこそ、
      # high 以外に何が出ているかを一度に見たい。
      #
      # **always() は使わない。** always() はワークフローが打ち切られたときにも
      # 実行されるため、上の concurrency（PR では cancel-in-progress: true）で
      # 打ち切った実行がここまで走ってしまう。**打ち切る指定が意味を失う。**
      # success() || failure() なら、成功と失敗では走り、打ち切り時には走らない。
      #
      # || true を付けているのは、npm audit が「1件でも見つかると非ゼロ」を返すためで、
      # **検査の結果を握り潰しているのではない。** 合否は上のステップが決める。
      - name: 依存の脆弱性の全件表示（合否には影響しない）
        if: success() || failure()
        run: npm audit || true

      # 秘密の値がソースに書かれていないかの検査。
      #
      # **これが無いと、秘密の露出を見る経路はファイル名の検査だけになる。**
      # `scripts/check-docs.test.sh` の 0c は「値を持つファイル名が .gitignore で無視され、
      # 追跡されていないか」を見るだけで（**対象は `scripts/doc-scope.sh` の `DOC_PRUNE_FILES`。
      # ここに写さない**——写すと、あちらに1行足したときこちらが静かに古くなる）、
      # **ファイルの中身は誰も見ていない。** ソースやワークフローに
      # トークン・鍵・パスワードが直接書かれても、CI は緑のまま通る。
      # AI レビューも差分しか読まないため、過去のコミットに残った秘密は拾わない。
      #
      # **PR ではその差分しか見ない。過去に残った秘密を見るのは、毎週の定期実行である。**
      # つまり「この PR が緑」は「この差分に秘密が無い」であって、
      # **「リポジトリに秘密が無い」ではない。**
      #
      # **踏むと壊れる: その週次実行は、60日間リポジトリに活動が無いと GitHub が自動で無効化する**
      # （パブリックリポジトリの schedule の仕様。README の「依存の版を上げない方針」に既出）。
      # **止まっても通知は来ず、CI は緑のまま**であり、
      # **過去に残った秘密を見る経路がこれだけである以上、止まったことを誰も検出できない。**
      # **再有効化は Actions の画面から行う。** 上の workflow_dispatch は
      # **その場で1回走らせるためのものであり、週次を戻すものではない**（README の代償4 と同じ手順）。
      #
      # **v3 を使う。** v2 は Node 20 で動いており、2026-09-16 に GitHub のランナーから
      # Node 20 が消えて動かなくなる（gitleaks-action の README）。
      #
      # **ライセンス鍵は要らない。** 必要なのは Organization が所有するリポジトリのみで、
      # ここは個人アカウントの公開リポジトリである。
      #
      # **コメントを止めているのは、permissions を contents: read のままに保つためである。**
      # 失敗はジョブのログに出る。PR へのコメントには pull-requests: write が要る。
      #
      # **if を付けているのは、npm audit が落ちた巡回でも走らせるためである。**
      # 付けないと、依存の脆弱性が未修正のあいだ秘密の検査が一度も走らない。
      # always() は使わない（上の concurrency で打ち切った実行まで走るため。上のステップと同じ理由）。
      #
      # 代償: **誤検知が出ると、全 PR のマージ経路が塞がる。** その場合は .gitleaks.toml の
      # allowlist に**理由を書いて**除外する。理由なしに除外しない（npm audit の閾値と同じ扱い）。
      - name: 秘密の値がソースに書かれていないかの検査
        if: success() || failure()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
