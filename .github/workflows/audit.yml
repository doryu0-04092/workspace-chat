name: audit

# 依存の脆弱性検査。要件定義書 4.3 が「npm audit と Dependabot を CI で
# 継続的に実行する」と定めている。
#
# ci.yml と分けている理由は2つ。
# 1. npm audit は registry の応答に依存する。落ちたときに lint やテストの結果まで
#    巻き添えで読めなくなるのを避ける
# 2. **「継続的に」を満たすには定期実行が要る。** PR と push だけでは、
#    コードが動かない期間に公表された脆弱性を誰も拾わない

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 09:00 JST（UTC 00:00）
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 代償1: --audit-level=high としているため、moderate 以下は止めない。
      # 開発用の推移依存に moderate が出ただけで全員の作業が止まると、
      # 「とりあえず外す」方向に働く。moderate 以下は Dependabot の PR で追う。
      #
      # 代償2: **修正版が公開されていない high 以上が出ると、全 PR のマージ経路が塞がる。**
      # npm audit には「この1件だけ無視する」指定が無い。その場合は次のどちらかを取る。
      #   a. package.json の overrides で修正済みの推移依存を強制する（原因を消す）
      #   b. 影響を評価したうえで、判断と期限を log に残して一時的に閾値を上げる
      # **b を選ぶときは必ず記録を残す。** 黙って閾値を上げると、この検査は形だけになる。
      - name: 依存の脆弱性検査
        run: npm audit --audit-level=high
