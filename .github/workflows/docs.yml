name: docs

on:
  pull_request:
  push:
    branches: [main]

# ci.yml と同じ理由。連続で push したとき古い実行を打ち切る。
# 打ち切るのは PR のときだけにする。main への push で打ち切ると、
# どの版が検査を通ったのかの記録が欠ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名は ci.yml と重ねない。ブランチ保護の必須チェックはジョブ名で
  # 指定するため、同名だとどちらを指しているか区別できない。
  docs:
    runs-on: ubuntu-latest
    # 既定は6時間。ぶら下がった実行がランナーの時間を食い尽くすのを避ける。
    timeout-minutes: 10
    # チェックアウトとスクリプトの実行だけで、書き込み権限は要らない。
    # 書かないとリポジトリ設定の既定値に依存し、write が付きうる。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: ドキュメントの検査
        run: bash scripts/check-docs.sh
      # 検査が「落ちるべきときに落ちる」ことを確かめる。
      # 上のステップは正常系を1回通すだけで、検査が壊れて何も検出しなくなっても緑になる。
      - name: 検査が壊れたときに落ちることの確認
        run: bash scripts/check-docs.test.sh
