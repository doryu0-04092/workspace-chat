name: claude-code-review

# PR の作成時と、その PR のブランチへの push 時に Claude Code がレビューする。
# 実装に入る前に導入する。作り終わってから指摘を受け取っても、開発中に直す機会が無いため。

on:
  pull_request:
    types: [opened, synchronize]

# 連続して push した場合、古いレビューを打ち切る。
# レビューは毎回 PR 差分・CLAUDE.md・REVIEW.md を読み直すためトークン消費が大きく、
# 途中の版に対するレビューを最後まで走らせる価値が無い。
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # レビュー結果を PR にコメントするために必要。強い権限である点を認識して付けている
      issues: read
      id-token: write # 必須。OIDC トークンを Claude GitHub App のトークンに交換する経路で使う
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # track_progress と use_sticky_comment は必ず対で指定する。
          # pull_request に prompt だけを渡すとエージェントモードになり、
          # use_sticky_comment（タグモードでのみ読まれる）が無視されて
          # レビューのたびに新しいコメントが積み上がる。
          track_progress: true
          use_sticky_comment: true

          prompt: |
            あなたはこのリポジトリのコードレビュアーです。日本語でレビューしてください。

            ## 1. まず観点を読む

            - `REVIEW.md` — レビューの観点と重大度の定義。**これが判断基準の本体である**
            - `CLAUDE.md` — プロジェクトの運用ルール（要件の3分類・認可の方針・開発フロー）

            ## 2. 重複して指摘しない

            この PR に既に付いているレビューコメントを確認し、
            **すでに指摘され、対応済みの項目は再度指摘しない。**
            新規のもの、または未対応のものだけを対象とする。

            ## 3. 変更を理解してからレビューする

            - この変更の意図は何か（新機能 / バグ修正 / リファクタリング / ドキュメント / 設定）
            - 影響範囲はどこまでか
            - **PR の説明と、実際の変更内容が一致しているか。** ずれていれば指摘する

            ## 4. 変更の種類ごとに見る

            | 種類 | 見ること |
            |---|---|
            | ドキュメント | 他の文書との整合性、記載内容の正しさ、相対リンクの妥当性、件数などの数値の整合 |
            | ワークフロー・設定 | 構文の正しさ、権限が過剰でないか、秘密情報が値として書かれていないか |
            | コード | `REVIEW.md` の 2〜6 章。**特に 2.1 の認可4経路を最優先で見る** |

            ## 5. 出力の作法

            - **日本語で書く。**
            - **調査した結果、問題なしと判断した項目は出力しない。**
              指摘が1件も無い場合にかぎり、「指摘なし」と1行だけ述べる。
            - **良い実装を褒めるコメントは書かない。** 修正する側にとってはノイズになる。
            - 1件ごとに `ファイル:行` を示す。**場所を示せない指摘は書かない。**
            - 1件ごとに「なぜ問題か」と「具体的にどう直すか」を書く。
              「◯◯すべき」だけでは受け取った側が判断できない。
            - `REVIEW.md` 1章の重大度を付ける（🔴 重大 / 🟡 要修正 / 🟣 既存の問題）。
              **⚪ 好みの問題は書かない。**
            - 🟡 は1回のレビューで最大5件まで。超えた分は「他に N 件」と件数だけ伝える。
            - **推測で書かない。** 実際に読んで確認できたことだけを述べる。
              確認できていない場合は「未確認」と明記する。

            ## 6. やらないこと

            - **コードを修正しない。コミットもプッシュもしない。** 指摘だけを返す。
              マージの可否を判断するのは人間である（`REVIEW.md` 0章）。
            - CI（lint / 型チェック / テスト）が機械的に判定できることは指摘しない。

          claude_args: |
            --model opus
            --disallowedTools "Bash"
