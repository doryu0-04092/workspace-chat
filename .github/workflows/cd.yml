name: cd

# main への push（PR のマージ）をトリガーに、
#   1. api・migrate イメージを linux/arm64 でビルドして ECR へ push する（#672）
#   2. ステージングが立っていれば、そのイメージでステージングへ出す（#688。scripts/deploy-staging.sh）
#
# terraform apply はここでは行わない（apply は常に人が行う）。ステージングはアプリだけを更新する。
# 本番への反映は、ステージングで検証した後に、人が release ブランチを進めて手動で行う（scripts/release.sh。README の CD の節）。
#
# 長期のアクセスキーは使わない。GitHub Actions の OIDC で、ジョブごとに権限を絞ったロールを引き受ける
# （infra/shared/main.tf の aws_iam_role.cd は ECR への push だけ、aws_iam_role.staging_deploy はステージングの更新だけ。#671・#685・#688）。

on:
  push:
    branches: [main]

# 連続で main に push（マージ）されても、ステージングへの反映は順番を保つ。打ち切ると
# 途中の版のマイグレーションだけが流れて、サービスが古い版のまま残りうるため、打ち切らずに並ばせる。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC でロールを引き受けるために要る
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      # scripts/release.sh と同じ規則（git rev-parse --short HEAD）。人が手動リリースの手順で
      # 同じコミットから同じタグを求め直せるようにする。
      - name: イメージのタグ
        id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ap-northeast-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --pull: apps/api/Dockerfile の土台をレジストリから取り直す（scripts/release.sh の手順2と同じ理由。
      # 土台は Dependabot で追わず、同じタグの中の更新をここで取り込む）。
      - name: api・migrate イメージを linux/arm64 でビルドする
        env:
          API_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-api:${{ steps.tag.outputs.value }}
          MIGRATE_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-migrate:${{ steps.tag.outputs.value }}
        run: |
          docker buildx build --pull --platform linux/arm64 --file apps/api/Dockerfile --target runtime \
            --tag "$API_IMAGE" --load .
          docker buildx build --pull --platform linux/arm64 --file apps/api/Dockerfile --target migrate \
            --tag "$MIGRATE_IMAGE" --load .

      # ARM64 で動くことは通常の CI（amd64 で scripts/api-image.test.sh を回す）では確かめていない。
      # push の前に、ネイティブモジュール（argon2）・Prisma の CLI・psql が ARM64 のイメージの中で動くことを見る
      # （scripts/release.sh の手順2と同じ確認）。
      - name: ARM64 で動くことを確かめる
        env:
          API_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-api:${{ steps.tag.outputs.value }}
          MIGRATE_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-migrate:${{ steps.tag.outputs.value }}
        run: |
          docker run --rm --platform linux/arm64 --entrypoint node "$API_IMAGE" \
            -e 'require(require("node:module").createRequire("/app/apps/api/dist/main.js").resolve("argon2"))'
          docker run --rm --platform linux/arm64 --entrypoint node "$MIGRATE_IMAGE" \
            node_modules/prisma/build/index.js --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint psql "$MIGRATE_IMAGE" --version

      - name: ECR へ push する
        env:
          API_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-api:${{ steps.tag.outputs.value }}
          MIGRATE_IMAGE: ${{ steps.ecr.outputs.registry }}/workspace-chat-migrate:${{ steps.tag.outputs.value }}
        run: |
          docker push "$API_IMAGE"
          docker push "$MIGRATE_IMAGE"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # デプロイ用のロールを Secret に設定するまでは飛ばす（README の CD の節の「動かすために必要な設定」）。
      # 設定の前に main へマージしても CD を赤にしない（ビルド用のロールで起きた「Could not load credentials」を繰り返さない）。
      - name: デプロイ用のロールが設定されているか
        id: configured
        env:
          ROLE: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
        run: if [ -n "$ROLE" ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.configured.outputs.value == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # ステージングは検証のときだけ立てる（README の CD の節）。立っていなければ、ここで飛ばして緑で終える。
      - name: ステージングが立っているか
        id: staging
        if: steps.configured.outputs.value == 'true'
        # 代入の行で呼ぶ（echo の引数の中の $(...) は、失敗しても step を落とさない）。確かめられなかったら赤にする。
        run: |
          exists=$(bash scripts/deploy-staging.sh exists)
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: 飛ばす
        if: steps.staging.outputs.exists != 'true'
        run: echo "ステージングへのデプロイを飛ばした（デプロイ用のロール：${{ steps.configured.outputs.value }}・ステージング：${{ steps.staging.outputs.exists || '確かめていない' }}。イメージ ${{ needs.build-and-push.outputs.tag }} は ECR にある）"

      - uses: actions/setup-node@v7
        if: steps.staging.outputs.exists == 'true'
        with:
          node-version: 24
          cache: npm

      - name: web をビルドする
        if: steps.staging.outputs.exists == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build -w @workspace-chat/shared
          npm run build -w @workspace-chat/web

      - name: ステージングへ出す
        if: steps.staging.outputs.exists == 'true'
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          WEB_DIST: apps/web/dist
        run: bash scripts/deploy-staging.sh deploy
