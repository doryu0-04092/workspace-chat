name: ci

# 実装を検査する CI。ドキュメントの検査は docs.yml が担う。
#
# パスで絞り込まない。`paths` で絞ると、そのパスに変更が無い PR ではジョブが
# 実行されず pending のまま残り、ブランチ保護の必須チェックにすると
# ドキュメントだけの PR が永久にマージできなくなる。
# 代償: 変更に関係のない検査も毎回走る。現在の規模では数分に収まる。

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR に連続で push した場合、古い実行を打ち切る。レビューの指摘に
# 対応する過程では push が続くため、打ち切らないと古い実行が走り続ける。
#
# 打ち切るのは PR のときだけにする。main への push で打ち切ると、
# どの版が検査を通ったのかの記録が欠ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名は docs.yml と重ねない。ブランチ保護の必須チェックは
  # ジョブ名で指定するため、同名だとどちらを指しているか区別できない。
  code:
    runs-on: ubuntu-latest
    # チェックアウトと検査の実行だけで、書き込み権限は要らない。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci は package-lock.json のとおりに入れる。install と違い、
      # 手元と CI で依存の版がずれない。
      - name: 依存の取得
        run: npm ci

      - name: lint（ESLint）
        run: npm run lint

      - name: 整形の検査（Prettier）
        run: npm run format:check

      - name: 型チェック（tsc）
        run: npm run typecheck

      # 型が通ってもビルドで落ちることがある。ソースが正しくても、
      # ビルド時の設定漏れで動かない成果物が出る事故は実際に起きている。
      - name: ビルド
        run: npm run build

      - name: テスト（Vitest）
        run: npm test

      # テストが失敗したときこそ残す。CI を実行した事実と結果を成果物として残すのが目的。
      # ただしレポートが実際に出ている場合に限る。前段で落ちたときや、テストの
      # ステップ自体が junit を書く前に落ちたときは reports/ が存在せず、
      # if-no-files-found: error が本来の失敗と無関係な2件目の失敗を出す。
      - name: テストレポートの保存
        if: always() && hashFiles('reports/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
